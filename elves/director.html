<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#100e0c">
<script>try{if(localStorage.getItem("kyle-stories-unlock")==="1")document.documentElement.dataset.unlocked="1";}catch(e){}</script>
<title>Lanternveil · Director</title>
<style>
  :root{--gold:#e7c98a;--line:rgba(231,201,138,.4)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#100e0c;color:#f6f1e6;overflow:hidden;font:500 16px/1.4 system-ui,-apple-system,sans-serif;touch-action:manipulation}
  input{font-size:16px}
  button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
  [hidden]{display:none !important}
  #stage{position:fixed;inset:0;width:100%;height:100svh;height:100dvh;background:#100e0c}
  #poster,#layerA,#layerB{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;background:#100e0c}
  #layerA,#layerB{opacity:0;z-index:1}
  #poster{z-index:0}
  #dirBtn{position:fixed;z-index:30;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:42px;height:42px;min-height:42px;padding:0;border-radius:50%;border:1px solid var(--line);background:rgba(16,12,10,.4);color:var(--gold);font:700 18px/1 Georgia,serif;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #dirMenu{position:fixed;z-index:29;top:calc(60px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:min(220px,72vw);padding:8px;border-radius:18px;background:rgba(16,12,10,.72);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:6px}
  #dirMenu button{min-height:40px;text-align:left;padding:8px 12px;border-radius:12px;border:1px solid rgba(231,201,138,.28);background:rgba(255,255,255,.04);font-size:15px}
  #dirMenu button:disabled{opacity:.4}
  #dirMenu a{color:var(--gold);font-size:12px;text-align:center;padding:6px}
  #pill{position:fixed;z-index:28;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(16,12,10,.55);border:1px solid var(--line);color:var(--gold);font:700 12px/1 system-ui;letter-spacing:.06em}
  html:not([data-unlocked]) body > :not(#lock){display:none !important}
  #lock{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:#100e0c}
  html[data-unlocked] #lock{display:none !important}
  #lock .panel{width:min(560px,100%);margin:0 auto;padding:18px;border-radius:28px;background:rgba(16,12,10,.92);border:1px solid var(--line)}
  #lock h1{margin:0;font:italic 42px/1 Georgia,serif}
  #lock .pwrow{display:flex;gap:8px}
  #lockPw{flex:1;min-width:0;min-height:48px;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:inherit}
  #lock .age{display:flex;align-items:center;gap:12px;min-height:48px}
  #lockErr{color:#ffb4b4;font-weight:700}
  .btn{min-height:44px;border-radius:14px;border:1px solid var(--line);background:transparent;padding:0 14px}
  .pri{background:linear-gradient(180deg,#f3ddb0,#c9964a);color:#24180c;border:0;width:100%;margin-top:12px}
</style>
</head>
<body>
<section id="lock">
  <form id="lockForm" class="panel" autocomplete="off">
    <p style="letter-spacing:.16em;color:#e7c98a;font:800 12px/1 system-ui">18+</p>
    <h1>Director</h1>
    <p>Aelith, emerald silk. All characters are adults.</p>
    <label class="age"><input type="checkbox" id="lockAge"> I am 18 or older</label>
    <label for="lockPw">Password</label>
    <div class="pwrow">
      <input id="lockPw" type="password" autocomplete="current-password" enterkeyhint="go" aria-label="Password">
      <button type="button" class="btn" id="lockShow">Show</button>
    </div>
    <p id="lockErr" hidden></p>
    <button type="submit" class="btn pri">Enter</button>
  </form>
</section>
<div id="stage">
  <img id="poster" alt="" src="director/idle_stand_poster.jpg">
  <video id="layerA" muted autoplay playsinline webkit-playsinline preload="auto"></video>
  <video id="layerB" muted autoplay playsinline webkit-playsinline preload="auto"></video>
</div>
<button type="button" id="dirBtn" aria-label="Poses" hidden>✦</button>
<div id="dirMenu" hidden></div>
<div id="pill" hidden></div>
<div id="preload" hidden></div>
<script>
(function () {
  var KEY = "kyle-stories-unlock";
  var SALT = "063edc75bd4b4e1301828dec7215c277";
  var HASH = "11b89436d8911e64c493f89db68f014d5ed19db80d319f78e92fab7f8179f6f9";
  var CLIPS = {
    stand: { src: "director/idle_stand.mp4", poster: "director/idle_stand_poster.jpg", loop: true, label: "Standing" },
    sit: { src: "director/idle_sit.mp4", poster: "director/idle_sit_poster.jpg", loop: true, label: "Sitting" },
    stretch: { src: "director/action_stretch.mp4", poster: "director/action_stretch_poster.jpg", loop: false, label: "Stretch" }
  };
  var pose = "stand";
  var busy = false;
  var front = 0;
  var token = 0;
  function $(id) { return document.getElementById(id); }
  function layer(i) { return $(i ? "layerB" : "layerA"); }
  function resetScroll() {
    var vv = window.visualViewport;
    if (window.scrollX || window.scrollY || (vv && (vv.offsetTop || vv.offsetLeft))) window.scrollTo(0, 0);
  }
  function preload() {
    var box = $("preload");
    Object.keys(CLIPS).forEach(function (k) {
      var v = document.createElement("video");
      v.muted = true;
      v.playsInline = true;
      v.preload = "auto";
      v.setAttribute("playsinline", "");
      v.setAttribute("webkit-playsinline", "");
      v.src = CLIPS[k].src;
      v.load();
      box.appendChild(v);
    });
  }
  function pill(text) {
    var el = $("pill");
    if (!text) { el.hidden = true; el.textContent = ""; return; }
    el.hidden = false;
    el.textContent = text;
  }
  function setMenu() {
    var menu = $("dirMenu");
    if (menu.hidden) return;
    var items = pose === "sit"
      ? [["stand", "Stand up"], ["stretch", "Stretch"]]
      : [["sit", "Sit on bed"], ["stretch", "Stretch"]];
    menu.innerHTML = "";
    items.forEach(function (pair) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = pair[1];
      b.disabled = busy;
      b.setAttribute("data-act", pair[0]);
      b.addEventListener("pointerup", function (e) {
        e.preventDefault();
        e.stopPropagation();
        choose(pair[0]);
      });
      menu.appendChild(b);
    });
    var back = document.createElement("a");
    back.href = "index.html";
    back.textContent = "Back to the story";
    menu.appendChild(back);
  }
  function hideMenu() { $("dirMenu").hidden = true; }
  function toggleMenu() {
    var menu = $("dirMenu");
    menu.hidden = !menu.hidden;
    if (!menu.hidden) setMenu();
  }
  function arm(el, clip) {
    el.muted = true;
    el.defaultMuted = true;
    el.loop = !!clip.loop;
    el.autoplay = true;
    el.playsInline = true;
    el.preload = "auto";
    el.playbackRate = 1;
    el.setAttribute("muted", "");
    el.setAttribute("playsinline", "");
    el.setAttribute("webkit-playsinline", "");
    if (clip.loop) el.setAttribute("loop", "");
    else el.removeAttribute("loop");
    el.poster = clip.poster;
  }
  function whenPlaying(el) {
    return new Promise(function (resolve) {
      var done = false;
      function finish() {
        if (done) return;
        if (!(el.currentTime > 0)) return;
        done = true;
        resolve();
      }
      el.addEventListener("playing", finish);
      el.addEventListener("timeupdate", finish);
      var p = el.play();
      if (p && p.catch) p.catch(function () {});
      setTimeout(function () { if (!done && el.readyState >= 2 && el.currentTime > 0) finish(); }, 900);
    });
  }
  function crossfade(clip, ms) {
    var my = ++token;
    var next = layer(1 - front);
    var prev = layer(front);
    $("poster").src = clip.poster;
    arm(next, clip);
    var ready = next.getAttribute("src") === clip.src && next.readyState >= 2
      ? Promise.resolve()
      : new Promise(function (resolve) {
        next.oncanplay = null;
        next.src = clip.src;
        if (next.readyState >= 2) resolve();
        else next.oncanplay = function () { resolve(); };
      });
    return ready.then(function () { return whenPlaying(next); }).then(function () {
      if (my !== token) return;
      next.style.zIndex = "3";
      prev.style.zIndex = "2";
      next.style.transition = "opacity " + ms + "ms linear";
      prev.style.transition = "opacity " + ms + "ms linear";
      next.style.opacity = "1";
      prev.style.opacity = "0";
      return new Promise(function (r) { setTimeout(r, ms + 40); });
    }).then(function () {
      if (my !== token) return;
      try { if (prev !== next) prev.pause(); } catch (e) {}
      front = 1 - front;
    });
  }
  function goIdle(which) {
    hideMenu();
    busy = true;
    return crossfade(CLIPS[which], 350).then(function () {
      pose = which;
      busy = false;
      pill(false);
      setMenu();
    });
  }
  function doAction(key) {
    hideMenu();
    busy = true;
    pill(CLIPS[key].label);
    var elToWatch;
    return crossfade(CLIPS[key], 250).then(function () {
      elToWatch = layer(front);
      return new Promise(function (resolve) {
        function done() { elToWatch.removeEventListener("ended", done); resolve(); }
        if (elToWatch.ended) resolve();
        else elToWatch.addEventListener("ended", done);
        setTimeout(done, 8000);
      });
    }).then(function () { return goIdle("stand"); });
  }
  function choose(key) {
    if (busy) return;
    if (key === "stand" || key === "sit") {
      if (pose === key) { hideMenu(); return; }
      goIdle(key);
      return;
    }
    doAction(key);
  }
  function boot() {
    document.documentElement.dataset.unlocked = "1";
    $("dirBtn").hidden = false;
    preload();
    resetScroll();
    window.addEventListener("resize", resetScroll);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", resetScroll);
      window.visualViewport.addEventListener("scroll", resetScroll);
    }
    $("dirBtn").addEventListener("pointerup", function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (busy) return;
      toggleMenu();
    });
    crossfade(CLIPS.stand, 250);
  }
  if (document.documentElement.dataset.unlocked === "1") { boot(); return; }
  var form = $("lockForm");
  var pw = $("lockPw");
  var show = $("lockShow");
  var err = $("lockErr");
  var age = $("lockAge");
  show.addEventListener("click", function () {
    var on = pw.type === "password";
    pw.type = on ? "text" : "password";
    show.textContent = on ? "Hide" : "Show";
    pw.focus();
  });
  function hex(buf) {
    var b = new Uint8Array(buf), o = "";
    for (var i = 0; i < b.length; i++) o += b[i].toString(16).padStart(2, "0");
    return o;
  }
  function same(a, b) {
    if (a.length !== b.length) return false;
    var n = 0;
    for (var i = 0; i < a.length; i++) n |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return n === 0;
  }
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!age.checked) { err.hidden = false; err.textContent = "Confirm you are 18 or older."; return; }
    crypto.subtle.digest("SHA-256", new TextEncoder().encode(SALT + pw.value)).then(function (buf) {
      if (!same(hex(buf), HASH)) { err.hidden = false; err.textContent = "That password is not right."; return; }
      try { localStorage.setItem(KEY, "1"); } catch (e) {}
      pw.value = "";
      boot();
    });
  });
})();
</script>
</body>
</html>
