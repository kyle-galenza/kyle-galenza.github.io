    if (!age.checked) { err.hidden = false; err.textContent = "Confirm you are 18 or older."; return; }
    var hashNow;
    try {
      hashNow = (window.crypto && crypto.subtle && window.TextEncoder)
        ? crypto.subtle.digest("SHA-256", new TextEncoder().encode(SALT + pw.value)).then(hex)
        : Promise.resolve(sha256hex(SALT + pw.value));
    } catch (e) {
      hashNow = Promise.resolve(sha256hex(SALT + pw.value));
    }
    hashNow.then(function (got) {
      if (!same(got, HASH)) { err.hidden = false; err.textContent = "That password is not right."; return; }
      pw.blur();
      [100, 300, 600, 900].forEach(function (ms) { setTimeout(syncViewport, ms); });
      setTimeout(function () {
        try { localStorage.setItem(KEY, "1"); } catch (e) {}
        try { sessionStorage.setItem(KEY, "1"); } catch (e2) {}
        pw.value = "";
        boot();
        syncViewport();
      }, 80);
    });
  });
})();
</script>
