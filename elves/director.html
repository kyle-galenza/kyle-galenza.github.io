<title>Lanternveil · Director</title>
<style>

  #poster{z-index:0}
  #dirBtn{position:fixed;z-index:30;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:42px;height:42px;min-height:42px;padding:0;border-radius:50%;border:1px solid var(--line);background:rgba(16,12,10,.4);color:var(--gold);font:700 18px/1 Georgia,serif;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

  #dirMenu a{color:var(--gold);font-size:12px;text-align:center;padding:6px}

  html[data-unlocked] #lock{display:none !important}
  #lock .panel{width:min(560px,100%);margin:0 auto;padding:18px;border-radius:28px;background:rgba(16,12,10,.92);border:1px solid var(--line)}

  #lockPw{flex:1;min-width:0;min-height:48px;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:inherit}

<body>

<script>

  function pill(text) {
    var el = $("pill");
    if (!text) { el.hidden = true; el.textContent = ""; return; }
    el.hidden = false;
    el.textContent = text;
  }
  function setMenu() {

      : [["sit", "Sit on bed"], ["smile", "Flirty smile"]];

      var b = document.createElement("button");
      b.type = "button";
      b.textContent = pair[1];
      b.disabled = busy;
      b.setAttribute("data-act", pair[0]);

        if (e && e.type !== "click" && e.preventDefault) e.preventDefault();
        if (e && e.stopPropagation) e.stopPropagation();
        choose(pair[0]);

      b.addEventListener("click", pick);
      menu.appendChild(b);
    });

    back.href = "index.html";
    back.textContent = "Back to the story";
    menu.appendChild(back);
  }
  function hideMenu() { $("dirMenu").hidden = true; }

  function arm(el, clip) {

    el.autoplay = true;
    el.playsInline = true;
    el.preload = "auto";
    el.playbackRate = 1;
    el.setAttribute("muted", "");
    el.setAttribute("playsinline", "");
    el.setAttribute("webkit-playsinline", "");

    el.poster = clip.poster;
  }
  function whenPlaying(el) {
    return new Promise(function (resolve) {

        if (done) return;

        el.removeEventListener("playing", finish);
        el.removeEventListener("timeupdate", finish);
        resolve(true);

      el.addEventListener("timeupdate", finish);

        if (el.currentTime > 0.01) finish();

        el.removeEventListener("timeupdate", finish);
        resolve(el.currentTime > 0.01);

      front = 1 - front;

    hideMenu();
    busy = true;
    return crossfade(CLIPS[which], "glide").then(function () {
      pose = which;
      if (!hold) {
        busy = false;
        pill(false);
      }
      setMenu();
    });
  }
  function doAction(key) {
    hideMenu();
    busy = true;
    pill(CLIPS[key].label);
    var chain = pose === "sit" ? goIdle("stand", true) : Promise.resolve();
    return chain.then(function () {
      busy = true;
      pill(CLIPS[key].label);
      return crossfade(CLIPS[key], "seam", { fromStart: true });
    }).then(function () {
      var elToWatch = layer(front);
      return new Promise(function (resolve) {
        function done() { elToWatch.removeEventListener("ended", done); resolve(); }
        if (elToWatch.ended) resolve();
        else elToWatch.addEventListener("ended", done);
        setTimeout(done, 8000);
      });
    }).then(function () { return crossfade(CLIPS.stand, "seam", { fromStart: true }); }).then(function () {
      pose = "stand";
      busy = false;
      pill(false);
      setMenu();
    });
  }
  function choose(key) {
    var now = Date.now();
    if (now - lastPick < 400) return;
    lastPick = now;
    if (busy) return;
    if (key === "stand" || key === "sit") {
      if (pose === key) { hideMenu(); return; }
      goIdle(key);
      return;
    }
    doAction(key);
  }
  function boot() {
    document.documentElement.dataset.unlocked = "1";
    $("dirBtn").hidden = false;
    preload();
    syncViewport();
    document.addEventListener("focusout", pinAfterBlur, true);
    document.addEventListener("pointerup", function () {
      var nodes = document.querySelectorAll("video");
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].paused && (nodes[i].currentSrc || nodes[i].getAttribute("src"))) {

          if (p && p.catch) p.catch(function () {});

    }, true);
    window.addEventListener("resize", syncViewport);
    window.addEventListener("orientationchange", syncViewport);
    window.addEventListener("pageshow", syncViewport);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", syncViewport);

    function onDir(e) {
      var now = Date.now();

    $("dirBtn").addEventListener("pointerup", onDir);
    $("dirBtn").addEventListener("click", onDir);

  if (document.documentElement.dataset.unlocked === "1") { boot(); return; }

  var pw = $("lockPw");
  var show = $("lockShow");
  var err = $("lockErr");

  }

    var bytes = unescape(encodeURIComponent(ascii)), len = bytes.length, bits = len * 8, pad = ((len + 9 + 63) >> 6) << 6, w = new Uint8Array(pad), i;
    for (i = 0; i < len; i++) w[i] = bytes.charCodeAt(i);
    w[len] = 0x80;
    var dv = new DataView(w.buffer);
    dv.setUint32(pad - 4, bits >>> 0, false);
    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19], W = new Uint32Array(64);
    for (var off = 0; off < pad; off += 64) {

      for (t = 0; t < 64; t++) {

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!age.checked) { err.hidden = false; err.textContent = "Confirm you are 18 or older."; return; }
