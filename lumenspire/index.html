const ATK_T={atk:1,multi:1,curse:1,blink:1};
const AREA_T={heavy:1,roots:1,breath:1,dive:1,collapse:1,lance:1,repel:1};
function canAttackFrom(e,x,y,tx,ty){const d=cheb(x,y,tx,ty);if(d<1||d>e.rng)return false;if(d>1&&e.ranged&&!los(x,y,tx,ty))return false;return true;}
function bestAttackTile(e,tx,ty,ignoreHero){
  const R=reach(e,e.mv,{ignore:ignoreHero?B.h:null});let best=null,bs=1e9;
  for(const n of R.values()){if(n.occ)continue;if(n.x===tx&&n.y===ty)continue;if(!canAttackFrom(e,n.x,n.y,tx,ty))continue;
    let s=n.d+(hazardAt(n.x,n.y)&&!(n.x===e.x&&n.y===e.y)?3:0);if(e.ranged&&cheb(n.x,n.y,tx,ty)===1)s+=1.5;if(e.ranged&&inCover(tx,ty,n.x,n.y))s-=.4;
    if(s<bs){bs=s;best=n;}}
  return best?{tile:{x:best.x,y:best.y},node:best,path:pathOf(best)}:null;
}
/* walking distance to (tx,ty) over open tiles, ignoring units: approach by path, not straight-line (no stalls behind rubble) */
function distFrom(tx,ty,phase){const D=new Map(),q=[[tx,ty]];D.set(kk(tx,ty),0);
  while(q.length){const [x,y]=q.shift(),d=D.get(kk(x,y));for(const [dx,dy] of D4){const nx=x+dx,ny=y+dy,k=kk(nx,ny);if(!inB(nx,ny)||D.has(k)||blockedTile(nx,ny,phase))continue;D.set(k,d+1);q.push([nx,ny]);}}
  return D;}
function approachNode(e,tx,ty,ignoreHero){
  const R=reach(e,e.mv,{ignore:ignoreHero?B.h:null}),DM=distFrom(tx,ty,e.phase);let best=null,bs=1e9;
  const walk=n=>(DM.has(kk(n.x,n.y))?DM.get(kk(n.x,n.y)):40)*3+n.d*.1+(hazardAt(n.x,n.y)?3:0);
  for(const n of R.values()){if(n.occ)continue;if(n.x===tx&&n.y===ty)continue;const d=cheb(n.x,n.y,tx,ty);
    const canShoot=d<=e.rng&&(d<=1||los(n.x,n.y,tx,ty));
    let s=e.ranged&&canShoot?Math.abs(d-Math.min(3,e.rng))*3+n.d*.1+(hazardAt(n.x,n.y)?3:0):walk(n)+(e.ranged?20:0);
    /* ranged foes look for a clear line instead of waiting behind pillars */
    if(s<bs){bs=s;best=n;}}
  /* no clear line from anywhere it can reach: walk in like a melee foe so it can't stall */
  if(best&&e.ranged&&cheb(best.x,best.y,tx,ty)>1&&!los(best.x,best.y,tx,ty)){bs=1e9;for(const n of R.values()){if(n.occ||(n.x===tx&&n.y===ty))continue;const s=walk(n);if(s<bs){bs=s;best=n;}}}
  return best;
}
function breathStop(x,y){const t=T(x,y);return !t||t.k==='P'||t.k==='R'||t.thorn>0;}
function lockPlan(e){
  const it=e.intent,H=B.h,ty=it.type;if(e.dead)return;
  const okT=(x,y)=>inB(x,y)&&T(x,y).k!=='P';
  if(ty==='heavy'){
    let dest=null;
    if(e.mv===0){if(canAttackFrom(e,e.x,e.y,H.x,H.y)||cheb(e.x,e.y,H.x,H.y)<=e.rng+1)dest={x:e.x,y:e.y};}
    else{const r=bestAttackTile(e,H.x,H.y);if(r)dest=r.tile;}
    if(!dest){it.type='atk';it.val=e.atk;return;}
    const tiles=[{x:H.x,y:H.y}];
    if(e.ranged||e.boss){for(const [dx,dy] of D4)tiles.push({x:H.x+dx,y:H.y+dy});}
    else{const d=dirTo(dest.x,dest.y,H.x,H.y)||[0,1];tiles.push({x:H.x+d[1],y:H.y+d[0]},{x:H.x-d[1],y:H.y-d[0]});}
    e.plan={locked:true,dest,tiles:tiles.filter(q=>okT(q.x,q.y))};return;}
  if(ty==='roots'){const tiles=[{x:H.x,y:H.y}];const c=[];for(let y=H.y-2;y<=H.y+2;y++)for(let x=H.x-2;x<=H.x+2;x++){if(!okT(x,y)||(x===H.x&&y===H.y))continue;const u=unitAt(x,y);if(u&&u.side==='e')continue;c.push({x,y});}
    shuffle(c).slice(0,3).forEach(q=>tiles.push(q));e.plan={locked:true,dest:{x:e.x,y:e.y},tiles};return;}
  if(ty==='breath'){/* three lanes of fire; each lane stops at the first pillar, rubble or thorn (line of sight) */
    const d=dirTo(e.x,e.y,H.x,H.y)||[0,1];const tiles=[];for(let o=-1;o<=1;o++)for(let k=1;k<=8;k++){const x=e.x+d[0]*k+d[1]*o,y=e.y+d[1]*k+d[0]*o;if(!inB(x,y)||breathStop(x,y))break;tiles.push({x,y});}
    e.plan={locked:true,dest:{x:e.x,y:e.y},tiles};return;}
  if(ty==='dive'){const tiles=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(okT(H.x+dx,H.y+dy))tiles.push({x:H.x+dx,y:H.y+dy});e.plan={locked:true,dest:{x:H.x,y:H.y},tiles};return;}
  if(ty==='collapse'){/* hero tile + 3 neighbours; never all 8, so there's always a way out */
    const nb=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const x=H.x+dx,y=H.y+dy;if(!okT(x,y)||T(x,y).k==='R')continue;const u=unitAt(x,y);if(u&&u.side==='e')continue;nb.push({x,y});}
    e.plan={locked:true,dest:{x:e.x,y:e.y},tiles:[{x:H.x,y:H.y}].concat(shuffle(nb).slice(0,3)),cave:true};return;}
  if(ty==='lance'){/* the row or column through you, whichever the seraph is nearer to */
    const row=Math.abs(e.y-H.y)<=Math.abs(e.x-H.x);const tiles=[];
    if(row){for(let x=0;x<GC;x++)if(okT(x,H.y))tiles.push({x,y:H.y});}else{for(let y=0;y<GR;y++)if(okT(H.x,y))tiles.push({x:H.x,y});}
    e.plan={locked:true,dest:{x:e.x,y:e.y},tiles,row};return;}
  if(ty==='repel'){const d=dirTo(e.x,e.y,H.x,H.y)||[0,1];const tiles=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(okT(H.x+dx,H.y+dy))tiles.push({x:H.x+dx,y:H.y+dy});
    e.plan={locked:true,dest:{x:e.x,y:e.y},tiles,push:d};return;}
  if(ty==='summon'){const n=it.n||1,c=[];const onHero=e.boss&&['thorn','king','seraph'].includes(e.base.id);const cx0=onHero?H.x:e.x,cy0=onHero?H.y:e.y;
    if(onHero){/* adds rise on the squares flanking you (sides/back first) */const f=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=H.x+dx,y=H.y+dy;if((!dx&&!dy)||!inB(x,y)||blockedTile(x,y)||unitAt(x,y)||T(x,y).k==='V')continue;f.push({x,y,s:flankOf(x,y,H)});}
      f.sort((a,b)=>b.s-a.s||Math.random()-.5);if(f.length>=n){e.plan={locked:true,summon:true,dest:{x:e.x,y:e.y},tiles:f.slice(0,n).map(q=>({x:q.x,y:q.y}))};return;}}
    for(let r=1;r<=3&&c.length<n*3;r++)for(let y=cy0-r;y<=cy0+r;y++)for(let x=cx0-r;x<=cx0+r;x++){if(cheb(x,y,cx0,cy0)!==r||!inB(x,y)||blockedTile(x,y)||unitAt(x,y)||T(x,y).k==='V')continue;c.push({x,y});}
    e.plan={locked:true,summon:true,dest:{x:e.x,y:e.y},tiles:shuffle(c).slice(0,n)};return;}
}
function planAll(){
  if(!B)return;const H=B.h;
  for(const e of foesAlive()){const ty=e.intent&&e.intent.type;
    e.reachSet=reach(e,e.mv,{ignore:H});
    if(ATK_T[ty]){if(ty==='blink'){e.plan={blink:true,hit:true,dest:null};continue;}
      const r=bestAttackTile(e,H.x,H.y);if(r)e.plan={dest:r.tile,hit:true,path:r.path};else{const a=approachNode(e,H.x,H.y);e.plan={dest:a?{x:a.x,y:a.y}:{x:e.x,y:e.y},hit:false,path:a?pathOf(a):null};}}
    else if(!(e.plan&&e.plan.locked))e.plan={dest:{x:e.x,y:e.y},hit:false};}
  B.threat=threatMap();
}
/* expected damage the hero would take standing on each tile next enemy turn */
function heroDmgFrom(e,raw,x,y,area){
  const st=B.st,sty=B.sty||{};let d=raw*100/(100+st.arm);if(e.chill>0)d*=.7;if(e.stagger)d*=.4;
  if(sty.curseWeak&&(e.curse||cheb(x,y,e.x,e.y)<=2))d*=1-sty.curseWeak;
  if(B.bless&&B.bless.def)d*=1-B.bless.def;if(RUN&&RUN.perk&&RUN.perk.def)d*=1-RUN.perk.def;
  return Math.max(1,Math.round(d));
}
function threatMap(){
  const m=new Map();
  for(const e of foesAlive()){if(e.stun>0)continue;const it=e.intent;if(!it)continue;
    if(AREA_T[it.type]&&e.plan&&e.plan.tiles){for(const q of e.plan.tiles){const k=kk(q.x,q.y);m.set(k,(m.get(k)||0)+heroDmgFrom(e,it.val,q.x,q.y,true));}continue;}
    if(!ATK_T[it.type])continue;
    const hits=it.hits||1;
    for(let y=0;y<GR;y++)for(let x=0;x<GC;x++){let ok=false;
      if(it.type==='blink')ok=true;
      else for(const n of e.reachSet.values()){if(n.occ||(n.x===x&&n.y===y))continue;const u=unitAt(n.x,n.y);if(u&&u!==e&&u!==B.h)continue;if(canAttackFrom(e,n.x,n.y,x,y)){ok=true;break;}}
      if(ok){const k=kk(x,y);m.set(k,(m.get(k)||0)+heroDmgFrom(e,it.val,x,y)*hits);}}}
  return m;
}
function expDmg(raw,e){const H=B.h;e=e||B.e;let d=heroDmgFrom(e||{chill:0},raw,H.x,H.y);return d;}

/* ---- movement / animation ---- */
function faceTo(u,tx,ty){const d=dirTo(u.x,u.y,tx,ty);if(d){u.face=d;if(d[0])u.flip=d[0];}}
async function animPath(u,path,ms=95){
  for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];const d=[b.x-a.x,b.y-a.y];u.face=[Math.sign(d[0]),Math.sign(d[1])];if(d[0])u.flip=Math.sign(d[0]);
    u.x=b.x;u.y=b.y;u.moving=true;await Promise.all([tween(u,'px',b.x,ms,easeIO),tween(u,'py',b.y,ms,easeIO)]);}
  u.moving=false;u.px=u.x;u.py=u.y;
}
async function foeWalk(e,path){
  if(!path||path.length<2)return;
  /* stop early if the next tile is taken (allies can be passed through, not stood on) */
  let end=path.length-1;while(end>0){const q=path[end];const u=unitAt(q.x,q.y);if(!u||u===e)break;end--;}
  path=path.slice(0,end+1);if(path.length<2)return;
  if(e.trait&&e.trait.id==='ember')path.forEach((q,i)=>{if(i<path.length-1)T(q.x,q.y).burn=Math.max(T(q.x,q.y).burn,2);});
  await animPath(e,path,FAST?0:110);
  /* Sword & Shield: foes that step into the tiles you guard eat a shield strike */
  if(B.sty&&B.sty.id==='swordshield'&&!B.guarded.has(e.uid)&&!e.dead){const H=B.h;
    if(guardTiles().some(q=>q.x===e.x&&q.y===e.y)){B.guarded.add(e.uid);const hp=uHead(H);floatNum(hp.x,hp.y-40,'Shield strike','txt');await heroMelee(e);hitFoe(e,B.sty.blockCounter||.45,{},H.x,H.y,null);}}
}
function guardTiles(){const H=B.h,f=H.face,fx=H.x+f[0],fy=H.y+f[1];return [{x:fx,y:fy},{x:fx+f[1],y:fy+f[0]},{x:fx-f[1],y:fy-f[0]}].filter(q=>inB(q.x,q.y));}
async function heroMelee(e,dist=.38){const H=B.h,dx=e.x-H.x,dy=e.y-H.y,l=Math.hypot(dx,dy)||1;SFX.swing();faceTo(H,e.x,e.y);
  await Promise.all([tween(H,'px',H.x+dx/l*dist,110,easeIn),tween(H,'py',H.y+dy/l*dist,110,easeIn)]);H.swing=1;tween(H,'swing',0,240);
  Promise.all([tween(H,'px',H.x,220,easeOut),tween(H,'py',H.y,220,easeOut)]);}
async function foeMelee(e,dist=.38){const H=B.h,dx=H.x-e.x,dy=H.y-e.y,l=Math.hypot(dx,dy)||1;
  await Promise.all([tween(e,'px',e.x+dx/l*dist,120,easeIn),tween(e,'py',e.y+dy/l*dist,120,easeIn)]);
  Promise.all([tween(e,'px',e.x,220,easeOut),tween(e,'py',e.y,220,easeOut)]);}
async function shot(type,a,b,ms,col){const p0=uHead(a),p1=uHead(b);await shoot(type,p0.x,p0.y+B.ts*.2,p1.x,p1.y+B.ts*.25,ms||200,col);}

/* ---- hero hits ---- */
function applyDot(e,key,turns,dmg,label){e[key]={turns,dmg:Math.max(1,Math.round(dmg))};const ep=uHead(e);if(label)floatNum(ep.x,ep.y-46,label,'txt');}
function applyShred(e,n){const cut=Math.min(e.arm,n);if(cut<=0)return;e.arm-=cut;e.shred=(e.shred||0)+cut;const ep=uHead(e);floatNum(ep.x,ep.y-40,'Armor cracked','txt');}
function applyCurse(e,sty){applyDot(e,'curse',3,Math.max(1,Math.round(B.st.atk*(sty.curseDot||.22))),'Cursed');}
function burnB(){return ((B.st.m.burnPct||0)+(B.sty&&B.sty.burnPct||0))/100;}
function hitFoe(e,mult,o,ax,ay,g){
  if(!e||e.dead)return {d:0};
  const st=B.st,m=st.m,sty=B.sty||{};
  const mods=heroAtkMods(e,ax,ay,g,o||{});const r=calcHit(e,mult,o||{},mods,true);let d=r.d;
  let abs=0;if(e.block>0&&!(o&&o.pierce)){abs=Math.min(e.block,d);e.block-=abs;d-=abs;}
  e.hp=Math.max(0,e.hp-d);
  if(m.mark&&!e.marked)e.marked=true;
  if(m.lifesteal&&d>0)healP(Math.round(d*m.lifesteal/100),true);
  if(d>0){if(sty.shred)applyShred(e,sty.shred);if(sty.curseOnHit)applyCurse(e,sty);}
  o=o||{};
  if(o.bleed)applyDot(e,'bleed',3,st.atk*.3,'Bleeding');
  if(o.poison)applyDot(e,'poison',3,st.atk*.15,'Poisoned');
  if(o.wound){e.wound=true;if(!e.bleed)applyDot(e,'bleed',2,st.atk*.16,'Gashed');}
  if(o.cinder)applyDot(e,'burn',2,st.atk*.18*(1+burnB()),'Cinder');
  if(o.burn)e.burn={turns:3,dmg:Math.max(1,Math.round(st.atk*.35*(1+burnB())))};
  RUN.dmg=(RUN.dmg||0)+d;
  const ep=uHead(e);
  if(abs)floatNum(ep.x+24,ep.y-10,'-'+abs+' shield','blk');
  if(d>0||!abs)floatNum(ep.x,ep.y,String(d),r.crit?'crit':'');
  if(mods.tags.length&&d>0&&!o.quietTag)floatNum(ep.x,ep.y-30,mods.tags[0].replace(/ [+−-]\d+%/,''),'txt');
  e.fl=1;tween(e,'fl',0,260);
  burst(ep.x,ep.y+B.ts*.3,'#d8202a',r.crit?24:12,r.crit?5:3.4,.14);burst(ep.x,ep.y+B.ts*.3,r.crit?'#ffb060':'#ff6a3a',r.crit?12:5,4,.05);
  if(r.crit){SFX.crit();if(!RM){A.shake=10;tween(A,'shake',0,320);}}else{SFX.hit();if(!RM){A.shake=Math.max(A.shake||0,4);tween(A,'shake',0,200);}}
  if(e.hp<=0)killFoe(e);
  renderBattle();
  return {d,crit:r.crit};
}
function killFoe(e){
  if(e.dead)return;e.dead=true;e.intent=null;e.plan=null;
  const t=T(e.x,e.y);if(t)t.gore=1+Math.floor(Math.random()*3);
  const ep=uPt(e);burst(ep.x,ep.y,'#8a0a10',e.boss?40:22,e.boss?6:4.4,.16);burst(ep.x,ep.y-B.ts*.3,e.col[0],14,3,.05);ring(ep.x,ep.y,'#c8282a',B.ts*.8,500);
  tween(e,'a',0,520,easeIn);tween(e,'sc',.75,520,easeIn);
  if(RUN){RUN.kills++;S.tot.kills++;}
  if(B.acting&&B.sty&&B.sty.id==='daggers'&&foesAlive().length){B.extra=Math.max(B.extra,2);}
}
function healP(n,quiet){const p=B.p;const h=Math.min(n,B.st.hp-p.hp);if(h<=0)return;p.hp+=h;if(!quiet||h>=5){const hp=uHead(B.h);floatNum(hp.x,hp.y-20,'+'+h,'heal');}}
async function knockback(e,ax,ay){
  const kn=knockInfo(e,ax,ay);if(!kn||e.dead)return;const ep=uHead(e);
  if(!kn.crash){e.x=kn.to.x;e.y=kn.to.y;await Promise.all([tween(e,'px',e.x,160,easeOut),tween(e,'py',e.y,160,easeOut)]);floatNum(ep.x,ep.y-40,'Knocked back','txt');
    const t=T(e.x,e.y);if(t.k==='V'){const d=Math.max(1,Math.round(e.max*.1));e.hp=Math.max(0,e.hp-d);floatNum(ep.x,ep.y,String(d),'');if(e.hp<=0)killFoe(e);}
    return;}
  const nx=e.x+kn.d[0]*.3,ny=e.y+kn.d[1]*.3;await Promise.all([tween(e,'px',nx,90,easeIn),tween(e,'py',ny,90,easeIn)]);Promise.all([tween(e,'px',e.x,200),tween(e,'py',e.y,200)]);
  if(!RM){A.shake=9;tween(A,'shake',0,300);}SFX.crit();floatNum(ep.x,ep.y-46,'Slammed','txt');
  const cd=Math.max(1,Math.round(B.st.atk*.4));
  const hurt=u=>{if(!u||u.dead||u.side!=='e')return;const d=Math.max(1,Math.round(cd*100/(100+u.arm*.5)));u.hp=Math.max(0,u.hp-d);const p=uHead(u);floatNum(p.x,p.y,String(d),'');u.fl=1;tween(u,'fl',0,240);burst(p.x,p.y+B.ts*.3,'#d8202a',10,3,.12);if(u.hp<=0)killFoe(u);};
  hurt(e);if(kn.into)hurt(kn.into);
}
const ACTS={
  async slash(g,tx,ty){const H=B.h;let e=unitAt(tx,ty);let ax=H.x,ay=H.y;
    if(g.lunge&&cheb(H.x,H.y,tx,ty)===2){const l=lungeTile(H.x,H.y,e);if(l){SFX.swing();await animPath(H,[{x:H.x,y:H.y},l],80);ax=l.x;ay=l.y;}}
    faceTo(H,tx,ty);
    const tg=areaTiles(g,ax,ay,tx,ty).map(q=>({u:unitAt(q.x,q.y),w:q.w})).filter(q=>q.u&&q.u.side==='e');
    for(let k=0;k<g.hits;k++){await heroMelee(e);for(const q of tg)hitFoe(q.u,g.mult*q.w,g.o,ax,ay,g);await wait(60);if(e.dead)break;}

    await wait(160);},
  async bash(g,tx,ty){const H=B.h,e=unitAt(tx,ty);await heroMelee(e,.45);hitFoe(e,g.mult,{},H.x,H.y,g);const ep=uHead(e);
    if(!e.dead){if(e.boss){if(B.sty.bashStunBoss&&!e.maceStun){e.stun=1;e.maceStun=1;floatNum(ep.x,ep.y-50,'Stunned','txt');}else{e.stagger=1;floatNum(ep.x,ep.y-50,'Staggered','txt');}}
      else{e.stun=1;floatNum(ep.x,ep.y-50,'Stunned','txt');}e.plan=null;}
    ring(ep.x,ep.y+B.ts*.3,'#ffd36b',B.ts*.7);await wait(220);},
  async guard(){const st=B.st,p=B.p,hp=uHead(B.h);p.block+=Math.round(st.hp*.3);if(B.sty.id==='swordshield')p.riposte=1;ring(hp.x,hp.y+B.ts*.4,'#8fc8ff',B.ts,600);SFX.block();
    healP(Math.round(st.hp*(.08+(st.m.guardHeal||0)/100)));floatNum(hp.x+10,hp.y-40,'Guard','blk');renderBattle();await wait(380);},
