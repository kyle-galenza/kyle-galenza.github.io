<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ashspire">
<meta name="theme-color" content="#0c0b0d">
<meta name="format-detection" content="telephone=no">
<title>Ashspire</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23201a4a'/%3E%3Cpath fill='%23d9a35a' d='M8 1.5 L10 14 H6Z'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0c0b0d; --ink:#ece5d8; --dim:#bab1a3; --dim2:#a89f92; --gold:#d9a35a;
  --line:rgb(255 255 255 / .10); --card:rgb(26 24 25 / .74);
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  --sl:env(safe-area-inset-left); --sr:env(safe-area-inset-right);
  --spring:cubic-bezier(.3,1.35,.5,1); --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(var(--st) + 8px) calc(16px + var(--sr)) calc(max(var(--sb),12px) + 10px) calc(16px + var(--sl));
  opacity:0;visibility:hidden;transform:translateY(12px) scale(.985);
  transition:opacity .3s ease,transform .45s var(--ease),visibility 0s linear .45s}
.screen.on{opacity:1;visibility:visible;transform:none;transition:opacity .3s ease,transform .45s var(--ease),visibility 0s}
.spacer{flex:1;min-height:8px}
svg{display:block;flex:0 0 auto}

/* Island: one pill that morphs for alerts */
#island{position:fixed;left:50%;top:calc(var(--st) + 10px);z-index:80;height:36px;width:150px;
  transform:translateX(-50%);border-radius:18px;overflow:hidden;pointer-events:none;
  background:rgb(12 11 12 / .66);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.25);
  transition:width .42s var(--spring),height .42s var(--spring),border-radius .42s var(--spring),opacity .25s ease,border-color .3s ease}
#island.hide{opacity:0}
#island.big{height:52px;border-radius:26px}
#island span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  font:700 13px/1 system-ui,-apple-system,sans-serif;letter-spacing:.01em;transition:opacity .22s ease}
#island .isl-a{opacity:0;font-size:15px;font-weight:800}
#island.alert .isl-b{opacity:0}
#island.alert .isl-a{opacity:1;transition-delay:.14s}
#island .isl-b{transition:opacity .12s ease}
#island:not(.alert) .isl-b{transition:opacity .22s ease .14s}
#measure{position:fixed;left:-999px;top:-999px;white-space:nowrap;font:800 15px system-ui,-apple-system,sans-serif;visibility:hidden}

/* Buttons */
.btn{min-height:50px;border-radius:16px;border:0;font-weight:800;font-size:17px;letter-spacing:-.005em;
  color:#2b1a00;background:linear-gradient(180deg,#e8c088,#c98a3e);
  box-shadow:0 8px 22px rgba(200,120,50,.28),inset 0 1px 0 rgba(255,255,255,.65);
  padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .14s var(--spring),opacity .2s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgb(255 255 255 / .08);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.small{min-height:44px;font-size:15px;border-radius:14px;padding:0 14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);display:grid;place-items:center;
  background:rgb(12 11 12 / .55);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--ink)}
.icon-btn:active{transform:scale(.94)}

/* Title */
#title{align-items:center;text-align:center}
.t-logo{margin-top:12vh}
.t-kicker{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--gold);border:1px solid rgb(217 163 90 / .45);padding:5px 11px;border-radius:999px}
#title h1{margin:14px 0 6px;font-size:52px;line-height:1.02;letter-spacing:-.035em;font-weight:850;
  background:linear-gradient(180deg,#efe2c8 10%,#d9a35a 60%,#b5652e);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 24px rgba(200,110,50,.35))}
#title .tag{margin:0;color:var(--dim);font-size:16px;line-height:1.45}
.t-card{width:100%;max-width:380px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:22px;background:var(--card);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);margin-bottom:12px;text-align:left}
.t-card canvas{width:56px;height:64px;border-radius:12px;background:rgb(255 255 255 / .05)}
.t-card b{font-size:17px;letter-spacing:-.01em;display:block}
.t-card span{font-size:13px;color:var(--dim)}
#title .btn{width:100%;max-width:380px;min-height:56px;font-size:18px}
.ver{margin-top:12px;font-size:12px;color:var(--dim2);padding:10px 18px;min-height:36px;letter-spacing:.04em}

/* Class pick */
.pk-head{margin:52px 0 12px}
.pk-head h2{margin:0;font-size:30px;letter-spacing:-.025em;line-height:1.1;font-weight:850}
.pk-head p{margin:6px 0 0;color:var(--dim);font-size:15px}
.classes{display:flex;flex-direction:column;gap:10px}
.cls{--r:22px;--pad:10px;display:flex;align-items:center;gap:12px;padding:var(--pad);border-radius:var(--r);text-align:left;
  background:var(--card);border:1.5px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  transition:border-color .25s,transform .3s var(--spring),background .25s}
.cls canvas{width:88px;height:104px;border-radius:calc(var(--r) - var(--pad));background:radial-gradient(circle at 50% 70%,rgb(255 255 255 / .10),rgb(255 255 255 / .02));flex:0 0 auto}
.cls b{font-size:19px;letter-spacing:-.015em;display:block}
.cls .role{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.cls p{margin:4px 0 6px;font-size:13px;line-height:1.4;color:var(--dim)}
.cls .bars{display:flex;gap:10px;font-size:11px;color:var(--dim2);font-weight:700;letter-spacing:.04em}
.cls .bars i{display:inline-block;width:6px;height:6px;border-radius:2px;background:rgb(255 255 255 / .18);margin-left:2px}
.cls .bars i.on{background:var(--cc)}
.cls.sel{border-color:var(--cc);background:rgb(48 43 42 / .82);transform:scale(1.015)}
#pick .btn{min-height:56px;margin-top:12px}

/* Hub */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-top:44px;gap:8px}
.curs{display:flex;gap:6px;flex-wrap:nowrap}
.cur{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px 0 7px;border-radius:17px;font-weight:800;font-size:14px;
  background:rgb(12 11 12 / .55);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);font-variant-numeric:tabular-nums;transition:transform .3s var(--spring)}
.cur.bump{transform:scale(1.14)}
.c-gold{color:#ffd77a}.c-shard{color:#8fe8ff}.c-star{color:#d9b8ff}
.card{--r:24px;--pad:14px;border-radius:var(--r);padding:var(--pad);background:var(--card);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);box-shadow:0 10px 30px rgba(0,0,0,.22)}
.hero-card{display:flex;gap:12px;align-items:center;margin-top:12px}
.hero-card canvas{width:104px;height:120px;border-radius:calc(var(--r) - var(--pad));background:radial-gradient(circle at 50% 75%,rgb(255 255 255 / .12),rgb(255 255 255 / .02));flex:0 0 auto}
.hc-info{flex:1;min-width:0}
.hc-cls{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.hc-lv{font-size:26px;font-weight:850;letter-spacing:-.025em;line-height:1.1;margin:2px 0 6px}
.xpbar{height:8px;border-radius:4px;background:rgb(255 255 255 / .10);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#8a6a3a,#d9a35a);transition:width .6s var(--ease)}
.xptxt{font-size:11px;color:var(--dim2);margin-top:4px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:5px 8px;border-radius:10px;background:rgb(255 255 255 / .07);color:var(--ink);font-variant-numeric:tabular-nums}
.spire-card{margin-top:10px}
.sc-head{display:flex;flex-direction:column;gap:3px}
.sc-head span{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.sc-head b{font-size:17px;letter-spacing:-.015em;font-weight:850}
.track{position:relative;display:flex;justify-content:space-between;align-items:center;margin:14px 6px 4px;height:34px}
.track .ln{position:absolute;left:14px;right:14px;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:rgb(255 255 255 / .12)}
.track .ln i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#8ad9ff,#d9a35a);transform-origin:left;transition:width .8s var(--ease)}
.track .nd{position:relative;width:28px;height:28px;border-radius:14px;display:grid;place-items:center;font-size:12px;font-weight:800;
  background:#262223;border:2px solid rgb(255 255 255 / .18);color:var(--dim)}
.track .nd.done{background:linear-gradient(180deg,#a8e6ff,#6cb8ff);border-color:transparent;color:#0b1a33}
.track .nd.cur{border-color:var(--gold);color:var(--gold);animation:pulse 1.6s var(--spring) 2}
.track .nd.boss{width:34px;height:34px;border-radius:17px;background:#3a1f3f;border-color:#ff8aa0;color:#ffb3c2}
.track .nd.boss.done{background:linear-gradient(180deg,#ffd38a,#b5652e);color:#2b1300}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.sc-idle{font-size:12px;color:var(--dim);margin-top:8px;display:flex;align-items:center;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{--r:22px;--pad:10px;position:relative;min-height:84px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-weight:800;font-size:14px;transition:transform .15s var(--spring)}
.tile:active{transform:scale(.95)}
.tile .ti{width:44px;height:44px;border-radius:calc(var(--r) - var(--pad));display:grid;place-items:center}
.badge{position:absolute;top:8px;right:8px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#ff5d73;color:#fff;font-size:12px;font-weight:800;
  display:none;align-items:center;justify-content:center;box-shadow:0 0 0 2px #1c1a1b}
.badge.on{display:flex;animation:pop .45s var(--spring)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.cps{display:flex;gap:8px;justify-content:center;margin:10px 0 0;overflow-x:auto;scrollbar-width:none}
.cps::-webkit-scrollbar{display:none}
.cp{min-width:56px;height:36px;border-radius:18px;border:1px solid var(--line);background:rgb(255 255 255 / .06);font-weight:800;font-size:13px;color:var(--dim);padding:0 12px}
.cp.sel{background:rgb(217 163 90 / .16);border-color:var(--gold);color:var(--gold)}
.climb{margin-top:10px;width:100%;min-height:72px;border-radius:24px;border:0;display:flex;align-items:center;justify-content:center;gap:12px;
  color:#2b1a00;background:linear-gradient(180deg,#ffe8a8,#ffb946 70%,#ff9d48);
  box-shadow:0 12px 30px rgba(255,170,60,.35),inset 0 1px 0 rgba(255,255,255,.7);transition:transform .15s var(--spring)}
.climb:active{transform:scale(.97)}
.climb .cl-main{font-size:24px;font-weight:850;letter-spacing:-.02em}
.climb .cl-sub{font-size:14px;font-weight:800;padding:5px 10px;border-radius:12px;background:rgb(80 40 0 / .14)}

/* Battle */
.b-top{display:flex;justify-content:space-between;align-items:flex-start}
.run-gold{position:absolute;right:calc(16px + var(--sr));top:calc(var(--st) + 60px);display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 6px;border-radius:14px;
  background:rgb(12 11 12 / .5);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);font-weight:800;font-size:13px;color:#ffd77a;font-variant-numeric:tabular-nums;transition:transform .3s var(--spring)}
.run-gold.bump{transform:scale(1.15)}
.einfo{margin:42px auto 0;width:min(300px,100%);padding:10px 12px;border-radius:20px;background:rgb(12 11 12 / .55);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);transition:opacity .3s, transform .4s var(--spring)}
.einfo.out{opacity:0;transform:translateY(-8px) scale(.97)}
.en-name{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:16px;letter-spacing:-.01em;margin-bottom:6px}
.tagb{font-size:11px;font-weight:800;letter-spacing:.1em;padding:3px 8px;border-radius:8px;display:none}
.tagb.on{display:inline-block}
.tagb.boss{background:rgb(255 93 115 / .2);color:#ff9fb0}
.tagb.elite{background:rgb(217 163 90 / .18);color:var(--gold)}
.hpbar{position:relative;height:16px;border-radius:8px;background:rgb(0 0 0 / .35);overflow:hidden}
.hpbar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .35s var(--ease)}
.hpbar i.gh{background:rgb(240 220 200 / .45);transition:width .7s ease .25s}
.hpbar i.fl{background:linear-gradient(180deg,#c8423a,#7a1a18)}
.hpbar.p i.fl{background:#4a6539}
.hpbar i.blk{background:repeating-linear-gradient(135deg,rgb(140 200 255 / .75) 0 4px,rgb(140 200 255 / .45) 4px 8px);right:0;left:auto;transition:width .3s}
.hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.erow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;min-height:30px}
.intent{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 6px;border-radius:15px;font-weight:800;font-size:14px;transition:transform .35s var(--spring),background .3s}
.intent.new{animation:pop .4s var(--spring)}
.intent .lbl{font-size:12px;font-weight:700;opacity:.9}
.int-atk{background:rgb(255 93 115 / .2);color:#ffb0bd}
.int-heavy{background:rgb(255 70 90 / .32);color:#ffd0d6;box-shadow:0 0 0 1.5px rgb(255 110 130 / .7)}
.int-def{background:rgb(110 180 255 / .2);color:#b9dcff}
.int-buff{background:rgb(255 170 80 / .2);color:#ffd2a3}
.int-heal{background:rgb(100 230 150 / .2);color:#b9f5cf}
.int-curse{background:rgb(180 70 50 / .22);color:#e0c6ff}
.int-stun{background:rgb(255 255 255 / .1);color:var(--dim)}
.sts{display:flex;gap:4px}
.st{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 7px 0 5px;border-radius:12px;font-size:12px;font-weight:800;background:rgb(255 255 255 / .09)}
.pstat{padding:10px 12px;border-radius:20px;background:rgb(12 11 12 / .58);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);margin-bottom:10px}
.ps-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:800;font-size:14px;min-height:24px}
.resbar{position:relative;height:10px;border-radius:5px;background:rgb(0 0 0 / .35);overflow:hidden;margin-top:6px}
.resbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .35s var(--ease)}
.resbar span{position:absolute;right:6px;top:-1px;font-size:9px;line-height:12px;font-weight:800;display:none}
.restxt{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:3px;font-weight:700;font-variant-numeric:tabular-nums}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sk{--r:18px;--pad:9px;position:relative;min-height:70px;border-radius:var(--r);border:1px solid var(--line);background:rgb(30 27 28 / .8);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;align-items:center;gap:10px;padding:var(--pad);text-align:left;overflow:hidden;
  transition:transform .14s var(--spring),opacity .25s,border-color .25s}
.sk:active{transform:scale(.95)}
.sk .ic{width:48px;height:48px;border-radius:calc(var(--r) - var(--pad));display:grid;place-items:center;flex:0 0 auto;color:#fff;background:var(--skc)}
.sk .tx{min-width:0;flex:1}
.sk .nm{font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .mt{font-size:12px;color:var(--dim);font-weight:700;margin-top:3px;display:flex;gap:8px}
.sk .mt .cost{color:#9fd0ff}
.sk.nores .mt .cost{color:#ff9aa8}
.sk .cdv{position:absolute;inset:0;background:rgb(6 5 6 / .66);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:850;font-size:22px;opacity:0;transition:opacity .25s;pointer-events:none}
.sk.oncd .cdv{opacity:1}
.sk .cdv small{font-size:12px;font-weight:700;color:var(--dim)}
.sk.locked{opacity:.55}
.sk.locked .ic{background:rgb(255 255 255 / .08)!important;color:var(--dim)}
.skills.busy .sk{opacity:.6}
.sk.hint{border-color:var(--gold);box-shadow:0 0 0 3px rgb(217 163 90 / .25)}
.sk.hint::after{content:"";position:absolute;right:14px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:7px;background:var(--gold);animation:tapHint 1.2s ease-in-out infinite}
@keyframes tapHint{0%{transform:scale(.6);opacity:.9}70%{transform:scale(1.8);opacity:0}100%{opacity:0}}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* FX */
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.fnum{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:24px;letter-spacing:-.02em;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(0,0,0,.35);animation:fnum .95s cubic-bezier(.2,.8,.3,1) forwards;white-space:nowrap}
.fnum.crit{font-size:32px;color:#ffd36b}
.fnum.crit::before{content:"CRIT ";font-size:14px;letter-spacing:.06em;vertical-align:middle}
.fnum.hurt{color:#ff8c9b}
.fnum.heal{color:#a6d68e}
.fnum.blk{color:#a9d4ff;font-size:18px}
.fnum.txt{font-size:16px;color:#e8e0d4}
@keyframes fnum{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}14%{transform:translate(-50%,-60%) scale(1.18);opacity:1}30%{transform:translate(-50%,-75%) scale(1)}75%{opacity:1}100%{transform:translate(-50%,-170%) scale(.95);opacity:0}}
.flyer{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;will-change:transform}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgb(6 5 6 / .56);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s}
.scrim.on{opacity:1;visibility:visible;transition:opacity .3s ease}
#scrimA{z-index:40}#scrimB{z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#2a2626,#161415 40%);border-radius:30px 30px 0 0;border:1px solid var(--line);border-bottom:0;
  padding:8px calc(16px + var(--sr)) calc(max(var(--sb),12px) + 12px) calc(16px + var(--sl));
  transform:translateY(105%);visibility:hidden;transition:transform .44s cubic-bezier(.25,1.12,.4,1),visibility 0s linear .44s;box-shadow:0 -24px 60px rgba(0,0,0,.45)}
.sheet.on{transform:none;visibility:visible;transition:transform .44s cubic-bezier(.25,1.12,.4,1),visibility 0s}
#sheetA{z-index:50}#sheetB{z-index:70}
.grab{width:40px;height:5px;border-radius:3px;background:rgb(255 255 255 / .25);margin:0 auto 4px;flex:0 0 auto}
.sh-head{display:flex;align-items:center;justify-content:space-between;min-height:50px;gap:10px;flex:0 0 auto}
.sh-title{font-size:24px;font-weight:850;letter-spacing:-.025em;line-height:1.1}
.sh-sub{font-size:13px;color:var(--dim);margin-top:2px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0;padding:2px 0 6px;overscroll-behavior:contain}
.sh-foot{flex:0 0 auto;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.sec{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:14px 2px 8px;display:flex;justify-content:space-between}

/* Items */
.it{--rc:#c9d1dc;position:relative;aspect-ratio:1;border-radius:16px;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--rc) 70%,transparent);
  background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 26%,transparent),rgb(255 255 255 / .03) 70%);color:var(--rc);transition:transform .2s var(--spring)}
.it:active{transform:scale(.94)}
.it .pl{position:absolute;right:4px;top:3px;font-size:11px;font-weight:850;color:#fff}
.it .il{position:absolute;left:5px;bottom:3px;font-size:11px;font-weight:700;color:var(--dim)}
.it .up{position:absolute;right:4px;bottom:3px;color:#a6d68e}
.it.empty{border-style:dashed;border-color:rgb(255 255 255 / .18);background:rgb(255 255 255 / .03);color:rgb(255 255 255 / .28)}
.it.sel{box-shadow:0 0 0 3px #fff;transform:scale(.94)}
.it .ck{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:10px;background:#fff;color:#161415;display:grid;place-items:center;z-index:2}
.it.sel::after{content:"";position:absolute;inset:0;border-radius:14px;background:rgb(255 255 255 / .12)}
.bag{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.icard{--rc:#c9d1dc;--r:22px;--pad:12px;border-radius:var(--r);padding:var(--pad);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 20%,#262056),#1e1a44 70%);
  border:1.5px solid color-mix(in srgb,var(--rc) 60%,transparent);box-shadow:0 0 28px color-mix(in srgb,var(--rc) 22%,transparent)}
.icard.drop{animation:dropIn .6s var(--spring) both}
@keyframes dropIn{0%{transform:translateY(30px) scale(.85);opacity:0}100%{transform:none;opacity:1}}
.ic-top{display:flex;gap:12px;align-items:center}
.ic-top .ico{width:56px;height:56px;border-radius:calc(var(--r) - var(--pad));display:grid;place-items:center;color:var(--rc);background:rgb(0 0 0 / .22);flex:0 0 auto}
.ic-name{font-size:18px;font-weight:850;letter-spacing:-.015em;line-height:1.15;color:var(--rc)}
.ic-meta{font-size:12px;color:var(--dim);margin-top:2px;font-weight:700}
.ic-stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ic-stats .chip.aff{color:#cfe6ff}
.delta{font-size:13px;font-weight:800;margin-top:8px;display:flex;align-items:center;gap:4px}
.delta.up{color:#a6d68e}.delta.dn{color:#ff9aa8}.delta.eq{color:var(--dim)}
.ic-acts{display:flex;gap:8px;margin-top:12px}
.ic-acts .btn{flex:1}
.rewards{display:flex;gap:8px;flex-wrap:wrap}
.rw{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 8px;border-radius:19px;background:rgb(255 255 255 / .08);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}

/* Gear sheet */
.paper{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}
.paper .col{display:flex;flex-direction:column;gap:10px}
.paper canvas{width:100%;height:200px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:52px;padding:4px 4px 4px 12px;border-radius:16px;background:rgb(255 255 255 / .06)}
.stat .sn{font-size:14px;color:var(--ink);font-weight:800}
.stat .sh2{font-size:11px;color:var(--dim);font-weight:700;margin-top:1px}
.stat .sl{flex:1;min-width:0}
.stat .sv{font-size:20px;font-weight:850;font-variant-numeric:tabular-nums;padding-right:6px;white-space:nowrap}
.plus{width:44px;height:44px;border-radius:12px;border:0;background:linear-gradient(180deg,#e8c088,#c98a3e);color:#2b1a00;display:grid;place-items:center;transition:transform .15s var(--spring)}
.plus:active{transform:scale(.9)}
.derived{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* Skill tree */
.abil{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--dim);text-align:center;line-height:1.2}
.ab .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff}
.ab.lock .ic{background:rgb(255 255 255 / .08)!important;color:var(--dim2)}
.tree{position:relative;display:grid;grid-template-columns:repeat(3,1fr);row-gap:34px;padding:4px 0 0}
.tree .bh{text-align:center;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.tn{position:relative;justify-self:center;width:68px;height:68px;border-radius:34px;border:2px solid rgb(255 255 255 / .16);background:#2a2526;display:grid;place-items:center;color:var(--dim2);transition:transform .2s var(--spring),border-color .25s,background .25s}
.tn:active{transform:scale(.93)}
.tn.avail{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px rgb(217 163 90 / .12)}
.tn.has{background:linear-gradient(180deg,var(--tc1),var(--tc2));border-color:transparent;color:#fff}
.tn.sel{box-shadow:0 0 0 3px #fff}
.tn .rk{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:850;padding:2px 7px;border-radius:9px;background:#121011;color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.tn .lk{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:11px;background:#121011;display:grid;place-items:center;color:var(--dim2)}
.tline{position:absolute;width:4px;border-radius:2px;background:rgb(255 255 255 / .12);overflow:hidden;transform:translateX(-50%)}
.tline i{display:block;width:100%;height:0;background:linear-gradient(180deg,var(--tc1),var(--tc2));transition:height .5s var(--ease)}
.tdet{margin-top:16px;min-height:118px}
.tdet b{font-size:17px;letter-spacing:-.01em}
.tdet p{margin:4px 0 10px;font-size:14px;line-height:1.45;color:var(--dim)}

/* Forge */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:16px;background:rgb(0 0 0 / .25);position:relative;flex:0 0 auto}
.seg button{min-height:42px;border:0;border-radius:12px;background:transparent;font-weight:800;font-size:14px;color:var(--dim);position:relative;z-index:1;transition:color .25s}
.seg button.on{color:#2b1a00}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 16px)/3);border-radius:12px;background:linear-gradient(180deg,#e8c088,#c98a3e);transition:transform .38s var(--spring)}
.shelf{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;padding:4px 2px 8px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.shelf::-webkit-scrollbar{display:none}
.shelf .it{flex:0 0 76px;scroll-snap-align:start}
.shelf::after{content:"";flex:0 0 6px}
.pips{position:relative;display:flex;justify-content:space-between;align-items:center;margin:14px 4px 6px;height:20px}
.pips .ln{position:absolute;left:6px;right:6px;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:rgb(255 255 255 / .12)}
.pips .ln i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#d9a35a,#b5652e);transition:width .5s var(--ease)}
.pips .pp{position:relative;width:14px;height:14px;border-radius:7px;background:#262223;border:2px solid rgb(255 255 255 / .2);transition:background .3s,transform .3s var(--spring)}
.pips .pp.on{background:#d9a35a;border-color:transparent}
.pips .pp.nx{border-color:#d9a35a;animation:pulse 1.4s var(--spring) infinite}
.cost{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cost .rw.no{color:#ff9aa8}
.upline{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:8px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.upline b{font-weight:850}.upline em{font-style:normal;color:#a6d68e;font-weight:850}
.slotpick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slotpick button{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:rgb(255 255 255 / .05);display:grid;place-items:center;color:var(--dim)}
.slotpick button.on{border-color:var(--gold);color:var(--gold);background:rgb(217 163 90 / .12)}
.note{font-size:13px;color:var(--dim);line-height:1.45;margin:8px 2px}
.empty-note{padding:18px;text-align:center;color:var(--dim);font-size:14px;border:1.5px dashed var(--line);border-radius:18px}
.toggle{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 4px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.sw{width:52px;height:32px;border-radius:16px;background:rgb(255 255 255 / .16);position:relative;border:0;transition:background .25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:transform .3s var(--spring)}
.sw.on{background:#5fd18f}.sw.on::after{transform:translateX(20px)}
.big-num{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1}

@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .card,.tile,.sk,.pstat,.einfo,.cur,.icon-btn,#island,.cls{background:rgb(28 26 27 / .95)}
}
@media (prefers-reduced-transparency: reduce){
  .card,.tile,.sk,.pstat,.einfo,.cur,.icon-btn,#island,.cls,.scrim{-webkit-backdrop-filter:none;backdrop-filter:none}
  .card,.tile,.sk,.pstat,.einfo,.cls{background:rgb(28 26 27 / .97)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .screen,.sheet,#island{transition-duration:.15s!important}
}
@media (max-height:700px){
  .t-logo{margin-top:6vh}.hero-card canvas{height:96px;width:84px}.tile{min-height:72px}.climb{min-height:62px}
}

/* ---- UX audit pass ---- */
#measure{display:inline-flex;align-items:center;gap:8px}
#measure svg{flex:0 0 auto}
.topbar,.run-gold{transition:opacity .2s ease,transform .42s var(--spring)}
body.isl-on #hub .topbar,body.isl-on #world .topbar,body.isl-on #battle .run-gold{opacity:0;transform:translateY(-8px) scale(.96);pointer-events:none}
#island.act{pointer-events:auto}
#island .undo{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:15px;background:rgb(255 255 255 / .16);color:#fff;font-size:14px;font-weight:850;margin-left:4px}
.sk .cdv{inset:0 0 0 67px;background:transparent;justify-content:flex-start;gap:5px;font-size:24px}
.sk.oncd .tx{opacity:0}
.sk.oncd .ic{filter:saturate(.35);opacity:.6}
.sk .tx{transition:opacity .2s}
.sk .mt{color:#cbc3b6}
.sk.locked{opacity:1}
.sk.locked .nm{color:#d8d0c4}
.sk.locked .mt{color:#c4bcb0}
.cp{height:44px;border-radius:22px;min-width:64px;font-size:14px}
.seg button{min-height:44px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;flex-wrap:nowrap}
.chip{flex-direction:column;align-items:flex-start;gap:1px;padding:5px 8px;white-space:nowrap;overflow:hidden;min-width:0}
.chip small{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--dim);display:flex;align-items:center;gap:4px;text-transform:uppercase}
.chip b{font-size:14px;font-weight:850;line-height:1.15}
.btn.tint{background:rgb(217 163 90 / .14);color:var(--gold);border:1px solid rgb(217 163 90 / .45);box-shadow:none}
.sh-foot{position:relative}
.sheet.ovf .sh-body+.sh-foot::before{content:'';position:absolute;left:0;right:0;top:-24px;height:24px;pointer-events:none;background:linear-gradient(180deg,rgb(22 20 21 / 0),#161415)}
.sp-ic{color:#a6d68e}
#pick::before{content:'';position:fixed;left:0;right:0;top:0;height:300px;background:linear-gradient(180deg,rgb(12 11 13 / .94) 35%,rgb(12 11 13 / 0));pointer-events:none;z-index:-1}

<script>
(() => {
'use strict';
const KA_GAME='lumenspire', KA_VERSION='1.5';
/* KA_TELEMETRY_START */
// Shared anonymous play-log module. No personal data.
// TELEMETRY_URL is the ntfy.sh topic. Messages over 4096 bytes become attachments,
// so the wire payload is a compact run summary (short keys, no events[], capped picks).
// The full run (including events) stays in localStorage.
const TELEMETRY_URL = 'https://ntfy.sh/ka-tlm-7f0exmas';
const TELEMETRY_LS_ID = 'kylearcade_pid';
const TELEMETRY_LS_RUNS = 'kylearcade_runs';
const TELEMETRY_CAP = 200;
const TELEMETRY_WIRE_MAX = 3800;
const KATel = (() => {
  const uid = () => {
    try {
      let id = localStorage.getItem(TELEMETRY_LS_ID);
      if (!id) {
        id = (crypto && crypto.randomUUID) ? crypto.randomUUID()
          : ('k'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
        localStorage.setItem(TELEMETRY_LS_ID, id);
      }
      return id;
    } catch (e) { return 'anon'; }
  };
  const readRuns = () => {
    try { return JSON.parse(localStorage.getItem(TELEMETRY_LS_RUNS) || '[]') || []; }
    catch (e) { return []; }
  };
  const writeRuns = (runs) => {
    try {
      if (runs.length > TELEMETRY_CAP) runs = runs.slice(runs.length - TELEMETRY_CAP);
      localStorage.setItem(TELEMETRY_LS_RUNS, JSON.stringify(runs));
    } catch (e) {}
  };
  const nowIso = () => new Date().toISOString();
  const tOf = (run) => Math.round(((Date.now() - run._t0) / 1000) * 10) / 10;
  const snapshot = (run) => {
    const o = {
      id: run.id,
      playerId: run.playerId,
      game: run.game,
      version: run.version,
      date: run.date,
      duration: tOf(run),
      level: run.level || 0,
      wave: run.wave || 0,
      result: run.result || 'in_progress',
      cause: run.cause || '',
      picks: run.picks,
      coinsEarned: run.coinsEarned || 0,
      coinsSpent: run.coinsSpent || 0,
      peakArmy: run.peakArmy || 0,
      kills: run.kills || 0,
      sent: run.sent || 0,
      events: run.events,
      upgrades: run.upgrades || null,
      loadout: run.loadout || null,
      final: !!run.final,
      cls: run.cls || '', gp: run.gp || 0, startFloor: run.startFloor || 0, bestFloor: run.bestFloor || 0
    };
    return o;
  };
  const compactPicks = (picks, cap) => {
    const src = Array.isArray(picks) ? picks.slice(-cap) : [];
    return src.map(p => {
      if (!p || typeof p !== 'object') return p;
      const o = { t: p.t, k: p.kind || p.k, i: p.id || p.i };
      if (p.rarity || p.r) o.r = p.rarity || p.r;
      if (p.lvl != null) o.lv = p.lvl;
      else if (p.lv != null) o.lv = p.lv;
      return o;
    });
  };
  const compactBody = (snap) => {
    const build = (pickCap, withU, withLd) => {
      const o = {
        i: snap.id,
        p: snap.playerId,
        g: snap.game,
        v: snap.version,
        d: snap.date,
        t: snap.duration,
        l: snap.level || 0,
        w: snap.wave || 0,
        r: snap.result,
        c: snap.cause || '',
        pk: compactPicks(snap.picks, pickCap),
        ce: snap.coinsEarned || 0,
        cs: snap.coinsSpent || 0,

function tone(f,d,type='sine',v=.12,slide=0,delay=0){
  if(muted||!AC)return;try{const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03);}catch(e){}
}
function noise(d,v=.2,f=1200,delay=0){
  if(muted||!AC||!noiseBuf)return;try{const t=AC.currentTime+delay,s=AC.createBufferSource(),b=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;b.type='bandpass';b.frequency.value=f;b.Q.value=.8;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(b).connect(g).connect(AC.destination);s.start(t);s.stop(t+d+.02);}catch(e){}
}

/* ---------- Items ---------- */
function rollRarity(f,boost){
  const w=RAR.map((r,i)=>i===0?r.w:r.w*(1+f*.035)*(boost||1));
  if(boost&&boost>1)w[0]*=.25;
  let t=w.reduce((a,b)=>a+b,0),x=Math.random()*t;for(let i=0;i<w.length;i++){x-=w[i];if(x<=0)return i;}return 0;
}
function affPool(){const C=CLASSES[S.cls];const s=['vit','critPct','critDmg','hpPct','atkPct','lifesteal','goldPct',C.prim,C.prim];if(C.prim!=='dex')s.push('dex');return s;}
function rollAff(k,L){
  if(k in STAT_NAME)return Math.max(1,Math.round((2+L*.45)*rnd(.8,1.2)));
  return {critPct:ri(2,5),critDmg:ri(8,18),hpPct:ri(4,9),atkPct:ri(3,8),lifesteal:ri(2,4),goldPct:ri(8,20)}[k];
}
function makeItem(slot,L,r){
  const C=CLASSES[S.cls];
  const it={id:'i'+(S.uid++)+Math.random().toString(36).slice(2,5),slot,r,L:Math.max(1,L),p:0,aff:[]};
  const noun=slot==='weapon'?pick(C.weapon):pick(NOUNS[slot]);
  it.name=pick(PREFIX[r])+' '+noun;
  const keys=[];const pool=shuffle(affPool());for(const k of pool){if(keys.length>=RAR[r].aff)break;if(!keys.includes(k))keys.push(k);}
  it.aff=keys.map(k=>[k,rollAff(k,it.L)]);
  return it;
}
function itemBase(it){
  const m=RAR[it.r].mult*(1+.12*it.p),L=it.L,o={};
  switch(it.slot){
    case 'weapon':o.atk=(5+L*2)*m;break;
    case 'helm':o.hp=(10+L*5)*m;o.arm=(2+L*1)*m;break;
    case 'armor':o.hp=(16+L*8)*m;o.arm=(4+L*1.8)*m;break;
    case 'gloves':o.atk=(2+L*.8)*m;o.crit=1+it.r;break;
    case 'boots':o.hp=(8+L*4)*m;o.arm=(2+L*.8)*m;o.dodge=1+it.r*.5;break;
    case 'charm':o.atk=(1+L*.6)*m;o.hp=(6+L*3)*m;break;
  }
  for(const k in o)o[k]=Math.round(o[k]*10)/10;
  return o;
}
function itemPower(it){if(!it)return 0;return Math.round(10+it.L*8*RAR[it.r].mult*(1+.12*it.p)+it.aff.length*(4+it.L*1.5));}
function gearPower(){return SLOTS.reduce((a,s)=>a+itemPower(S.gear[s]),0);}
function baseLines(it){
  const b=itemBase(it),o=[];
  if(b.atk)o.push(['sword','ATK',Math.round(b.atk)]);if(b.hp)o.push(['heart','HP',Math.round(b.hp)]);
  if(b.arm)o.push(['shield','Armor',Math.round(b.arm)]);if(b.crit)o.push(['eye','Crit',b.crit+'%']);if(b.dodge)o.push(['wind','Dodge',b.dodge+'%']);
  return o;
}
function affText(a){return `+${a[1]}${AFF_PCT[a[0]]?'%':''} ${AFF_NAME[a[0]]}`;}
function slotIcon(slot){return slot==='weapon'?CLASSES[S.cls].wIcon:slot;}

/* ---------- Hero stats ---------- */
function treeMods(){
  const C=CLASSES[S.cls],m={};
  for(const n of C.tree){const r=S.tree[n.id]||0;if(!r)continue;for(const k in n.eff)m[k]=(m[k]||0)+n.eff[k]*r;}
  return m;
}
function hs(){
  const C=CLASSES[S.cls],m=treeMods(),st=Object.assign({},S.stats);
  let atk=4+S.lvl*1.2,hp=90+S.lvl*10,arm=0,crit=5,dodge=0;
  for(const s of SLOTS){const it=S.gear[s];if(!it)continue;const b=itemBase(it);
    atk+=b.atk||0;hp+=b.hp||0;arm+=b.arm||0;crit+=b.crit||0;dodge+=b.dodge||0;
    for(const [k,v] of it.aff){if(k in st)st[k]+=v;else m[k]=(m[k]||0)+v;}}
  atk=(atk+st[C.prim]*1.6)*(1+(m.atkPct||0)/100);
  hp=(hp+st.vit*10)*(1+(m.hpPct||0)/100);
  crit=Math.min(75,crit+st.dex*.3+(m.critPct||0));
  dodge=Math.min(40,dodge+st.dex*.15+(m.dodge||0));
  const resMax=C.res==='Mana'?60+st.int*2:100;
  return {atk:Math.round(atk),hp:Math.round(hp),arm:Math.round(arm),crit:Math.round(crit*10)/10,critDmg:150+(m.critDmg||0),dodge:Math.round(dodge*10)/10,
    resMax,regen:C.regen+(m.regen||0),m,st,gold:1+(m.goldPct||0)/100};
}
const xpNeed=l=>Math.round(20*Math.pow(l,1.4));
function gainXp(n){
  S.xp+=n;const ups=[];
  while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;S.statPts+=3;S.skillPts+=1;ups.push(S.lvl);}

}

/* Tweens, particles, projectiles */

  const tr=toEl.getBoundingClientRect(),tx=tr.left+18,ty=tr.top+tr.height/2;

      {transform:`translate(${mx}px,${my}px) scale(1)`,opacity:1,offset:.55},{transform:`translate(${tx}px,${ty}px) scale(.55)`,opacity:.9}],
      {duration:620+i*30,delay:i*55,easing:'cubic-bezier(.45,0,.6,1)',fill:'both'});

/* ---- Update ---- */

function updateWorld(dts,now){

    if(HERO.auto){if(mv)HERO.auto.stuck=0;else if((HERO.auto.stuck=(HERO.auto.stuck||0)+dts)>.35){HERO.auto=null;showIsland('Get closer','#f0d7a0',{key:'closer'});}}if(Math.abs(vx)>.15)HERO.face=vx>0?1:-1;if(mv){HERO.walk+=dts*Math.hypot(vx,vy);if(S.ftue&&!S.ftue.moved){S.ftue.moved=1;hideIsland('walk');save();}}}
  const cl=Math.min(1,dts*7),t=camTarget();CAM.x+=(t.x-CAM.x)*cl;CAM.y+=(t.y-CAM.y)*cl;
  if(frozen)return;
  // triggers

  if(A.kind==='town'&&Math.hypot(HERO.x-580,HERO.y-920)<220)prefetchPor('maid');

  for(const e of A.ents){if(e.k!=='npc')continue;const d=Math.hypot(e.x-HERO.x,e.y-HERO.y);
    e.face=HERO.x>e.x?1:-1;

  for(const e of A.ents){if(e.k==='chest'&&!e.open&&Math.hypot(e.x-HERO.x,e.y-HERO.y)<24){openChest(e);}}
  // monsters

      const dh=Math.hypot(HERO.x-m.x,HERO.y-m.y),dHome=Math.hypot(m.x-m.hx,m.y-m.hy);

const PFILE={warrior:'hero_warrior',ranger:'hero_ranger',mage:'hero_mage',blacksmith:'blacksmith',maid:'maid'};

  el.classList.remove('loading');if(p.state==='bad'){el.classList.add('missing');img.removeAttribute('src');return;}

  if(screen==='battle'&&B){
    cx.save();cx.translate(sh[0],sh[1]);
    cx.fillStyle='rgba(255,255,255,.06)';ell(cx,POS.hx,POS.gy+2,48*POS.heroS,10*POS.heroS);cx.fill();ell(cx,POS.ex,POS.gy+2,(B.e.boss?78:56)*POS.enS,12*POS.enS);cx.fill();
    renderSprite(SPR.hero,c=>drawHero(c,S.cls,t,{swing:A.swing,draw:A.draw,glow:A.glow}),POS.heroS*1.05,A.hf);
    cx.globalAlpha=A.ha;cx.drawImage(SPR.hero,POS.hx+A.hdx-SPX,POS.gy+A.hdy-SPY,SPW,SPH);cx.globalAlpha=1;
    if(A.ea>0.01){const e=B.e,sc=POS.enS*(e.boss?1:1.15)*A.es;renderSprite(SPR.enemy,c=>{c.scale(1,1);drawMonster(c,e,t+1,e.elite);},sc,A.ef,needsRim(e));
      cx.globalAlpha=A.ea;cx.drawImage(SPR.enemy,POS.ex+A.edx-SPX,POS.gy+A.edy-SPY,SPW,SPH);cx.globalAlpha=1;}
    drawFx(now,dt);cx.restore();
  }else if(PS.length||PJ.length||RINGS.length)drawFx(now,dt);
  if(S){
    if(screen==='hub')drawPortrait($('hubHero'),S.cls,t,1);
    if(screen==='title')drawPortrait($('tHero'),S.cls,t,1);
    const gh=$('gearHero');if(gh)drawPortrait(gh,S.cls,t,1.1);
  }
  if(screen==='pick')document.querySelectorAll('canvas[data-por]').forEach(c=>drawPortrait(c,c.dataset.por,t,1));
}
