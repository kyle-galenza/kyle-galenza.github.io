const ROMANCE={
 marla:{up:[null,
   [_x("Marla slides a bowl across the bar before you've ordered."),_n("Stew. On the house. Don't look at me like that, it's yesterday's."),_h("It's still warm."),_n("Well. I may have kept it warm. For someone. Eat.")],
   [_x("After close, Marla doesn't put the chairs up. She pours two cups and sits on the bar instead of behind it."),_n("I've been told I smile more when you're in. Pip says it's unsettling."),_h("I like it."),_n("Course you do. You're the cause."),_x("She looks at you a moment longer than she needs to, then laughs at herself and looks away. Her cheeks are pink, and it isn't the fire.")],
   [_x("The inn is dark. Marla takes your hand at the foot of the stairs, rough-palmed and warm, and doesn't let go."),_n("I've buried a husband and three climbers and I told myself that was the end of that chapter."),_n("Then you walked in with ash in your hair and paid your tab on time, the menace."),_h("Marla."),_n("Hush. Let an old innkeeper say it once: I want you here. Not as a guest."),_x("She pulls you into an embrace that smells of woodsmoke and bread, and kisses you, brief and sure, like closing a door against the cold.")]],
  talk:[
   [[_n("Boots by the fire, not on it. I've lost two pairs of good tongs to fools warming their toes.")],
    [_n("You're the one climbing the tower. I'll keep a room. I won't keep it long."),_h("Encouraging."),_n("Honest. Different thing.")],
    [_n("Coin first, then talk. I like you fine, but I like coin longer.")],
    [_n("Pip's sweet on half the room. Don't take it personal if she's sweet on you too.")],
    [_n("Stew, bread, the dark ale. That's the menu. The menu is not negotiable.")],
    [_n("Come back down in one piece. Pieces are terrible tippers.")]],
   [[_n("You're dripping ash on my floor again. Sit. No, not there. There, where I can keep an eye on you.")],
    [_n("I saved you the heel of the loaf. Nobody wants the heel. I figured you'd be daft enough to."),_h("I love the heel."),_n("See? Daft.")],
    [_n("You've got a laugh like a busted bellows. It's not a complaint. Do it again.")],
    [_n("If you die up there I'm keeping your tab open out of spite. Don't make me.")],
    [_n("Pip asked if I fancied you. I told her I fancy a quiet night. Then you walked in."),_h("And?"),_n("And it's not quiet, is it.")],
    [_n("Here. Taste this. Too much thyme? ...No, you're right. It's perfect. Don't tell anyone you were right.")]],
   [[_n("I put on the good apron. Don't say anything. ...You can say something nice.")],
    [_x("Marla brushes ash from your collar and leaves her hand there a beat too long."),_n("You'd think a hero would own a brush.")],
    [_n("You've got kind eyes for someone who hits things for a living. It's very inconvenient.")],
    [_n("When you're late back, I count the stairs. Thirty-one. I've counted them a lot this month.")],
    [_n("Sit at the end of the bar. Closer. That's the seat I can see from the kitchen hatch."),_h("Why does that matter?"),_n("Work it out, clever.")],
    [_x("Your fingers touch over the same cup. She doesn't move hers."),_n("...Your hands are cold. That's all this is. A medical concern.")]],
   [[_n("Come here. Let me look at you. ...All there. Good. Now kiss me hello like a person who missed me.")],
    [_n("Stay a while. The stew'll keep and so will the tower.")],
    [_x("Marla holds your hand under the bar while she takes orders with the other one."),_n("Don't look so pleased. People will talk."),_h("Let them."),_n("...Aye. Let them.")],
    [_n("I lit the lantern again last night. First time in years. I liked having a reason.")],
    [_n("When this is all done, you and me, a porch, two chairs. I'll even let you pick the ale.")],
    [_x("She rests her forehead against yours for a moment by the hearth."),_n("There. That's me, saying the soft thing. Don't make me say it twice.")]]]},
 pip:{up:[null,
   [_x("Pip bounces over before you've sat down."),_n("Your stool! I saved it! I had to fight a dwarf. Well, I asked him nicely. Same thing!"),_h("You saved me a seat?"),_n("Every night now. It's tradition. As of today. Don't argue with tradition.")],
   [_x("Pip finds you in the yard, sits beside you on the step, and goes uncharacteristically quiet."),_n("Can I tell you something silly? I put my hair up differently tonight. To see if you'd notice."),_h("I noticed."),_n("You did?! Oh no. Oh, that's worse. Now I'm blushing. Look away. No, don't."),_x("She bumps her shoulder against yours and leaves it there, warm and fidgety, grinning at the stars.")],
   [_x("Up in the crooked loft, among the plants, Pip laces her fingers through yours."),_n("I always said I'd leave for the coast the second I could. I've had the money for a month."),_h("Why are you still here?"),_n("You know why. You're why. You're my coast."),_x("She leans in and kisses you, quick and a little clumsy, then laughs into your shoulder and holds on tight.")]],
  talk:[
   [[_n("Hi! Hello! Sorry! What can I get you? Don't say water, Marla charges for water.")],
    [_n("You're the tower one! Everyone's talking about you. Mostly nice things. Mostly.")],
    [_n("Careful with the third step, it bites. Not literally. Mostly not literally.")],
    [_n("If you tip, I remember your name. If you don't, I remember your face. Forever."),_h("That's a threat."),_n("It's customer service!")],
    [_n("I'm Pip. Just Pip. It's short for Pip.")],
    [_n("Can't stop, the stew's escaping. Wave if you need me! Not like that. Like a person.")]],
   [[_n("You've got soot on your nose. No, other side. ...Hold still. There. Saved your dignity. That'll be one tip.")],
    [_n("I told table six you're my favourite customer. Now table six is sulking. Worth it.")],
    [_n("Guess what I did today. No, guess. ...Wrong! I fell in the cellar. But gracefully.")],
    [_n("You always look so serious coming down from the tower. I'm making it my job to fix that. Smile. Smile! There it is.")],
    [_n("Ten coppers says I can carry six mugs at once."),_h("Deal."),_n("...Seven coppers says I can carry five mugs at once.")],
    [_n("Are you staying for the music tonight? You should. Somebody has to dance badly with me.")]],
   [[_n("You look nice. I mean you always look nice. I mean, um. Your boots are clean! Hello!")],
    [_x("Pip ties a ribbon round your wrist and takes her time knotting it."),_n("For luck. And so everyone knows who you belong to. To. Who you belong to the inn. I'm working on the sentence.")],
    [_n("I keep finding reasons to walk past your table. You've had your mug refilled four times. It's not thirst, is it. It's me.")],
    [_n("You've got a good face for looking at. That's a compliment. I've been practising it all day and that's the best I've got.")],
    [_x("She leans on your shoulder while she counts tips, cheeks bright."),_n("Don't move. You're very comfortable. This is entirely professional.")],
    [_n("If you kept coming back just for me, hypothetically... that'd be fine. Hypothetically lovely.")]],
   [[_x("Pip runs the length of the room and hugs you, tray and all."),_n("You're back! I made you a pie. It's slightly on fire. I love you. Eat the pie.")],
    [_n("Stay a while? I'm off in ten. We can sit on the roof and you can tell me the stars' names wrong again.")],
    [_x("She holds your hand across the table and swings it, very pleased with herself."),_n("Look at us. Disgusting. I love it.")],
    [_n("I don't need the coast anymore. Well, I want to see it. With you. Can we? Someday?"),_h("Someday."),_n("That's a promise now. I'm writing it on the wall.")],
    [_n("Marla says I hum when you're here. I hum when I'm happy. Draw your own conclusions!")],
    [_x("Pip kisses your cheek on her way past with three stews, without spilling one."),_n("Talent!")]]]},
 aelira:{up:[null,
   [_x("Aelira finishes a bandage and, instead of dismissing you, pours two cups of tea."),_n("Stay for a cup. You are, I have decided, tolerable company."),_h("High praise."),_n("From me? The highest. I have spent three centuries finding most people intolerable.")],
   [_x("In the herb beds at dusk, Aelira tucks a sprig of moonwort behind your ear and studies the result."),_n("Hm. It suits you. I am going to think about that for longer than is reasonable."),_h("Is that a diagnosis?"),_n("It is a symptom. Your pulse is up, by the way. So is mine."),_x("Her ears flush faintly pink. She looks away, at the river, and does not stop smiling.")],
   [_x("At the cottage door, Aelira takes both your hands and turns them over, as if checking for wounds that aren't there."),_n("I stopped learning names a hundred years ago. It hurt too much to lose them."),_n("I learned yours anyway. I say it to myself when you are in the tower."),_h("Aelira."),_n("Yes. Like that. Stay a while. Let me be foolish once in three hundred years."),_x("She draws you into her arms, and kisses you, slow and certain, the way she does everything that matters.")]],
  talk:[
   [[_n("Sit. Show me the arm. ...Yes, that is a wound. Congratulations.")],
    [_n("You humans heal so quickly. And break so quickly. It's exhausting to watch.")],
    [_n("Drink this. It tastes of bark because it is bark.")],
    [_n("No, I will not tell you how old I am. Older than the town. Younger than the river.")],
    [_n("Please do not bleed on the clean linen. I have three clean linens. That is all of them.")],
    [_n("Rest is also a remedy. No one ever believes me about that one.")]],
   [[_n("You flinched less this time. Either you're getting braver or my hands are getting gentler. I suspect both.")],
    [_n("I named a seedling after you. It's stubborn and it keeps leaning toward the light. Accurate.")],
    [_n("You talk to me as though I'm not ancient and terrifying. It's novel. Keep doing it.")],
    [_n("The salve works better if I apply it. That is medicine, not an excuse. Mostly medicine.")],
    [_n("Hold the lamp. Higher. ...You're watching me, not the wound."),_h("Sorry."),_n("Hm. I didn't say stop.")],
    [_n("I have taught kings to hold a mortar. You are worse at it than any of them. Again.")]],
   [[_n("You have lovely hands. For someone who uses them so badly. Here. Let me.")],
    [_x("Aelira's fingertips linger at your wrist long after she's found your pulse."),_n("Elevated. How curious. Mine too. We should both see a healer.")],
    [_n("I find myself listening for your step on the path. It's a terrible habit for an elf. We're meant to be patient.")],
    [_n("The elves have a word for the colour of your eyes in lamplight. I'll tell you when I'm braver.")],
    [_n("Walk me to the river? I could go alone. I've gone alone for a century. I'd rather not, tonight.")],
    [_x("She tucks a loose strand of your hair back into place without asking."),_n("There. Now you're presentable. Now I can stare properly.")]],
   [[_x("Aelira leans against you on the bench, head on your shoulder, eyes closed."),_n("Hush. I'm listening to your heart. It's become my favourite sound.")],
    [_n("Stay a while. The kettle is on, and I've stopped pretending it's for me.")],
    [_x("She laces her fingers with yours and turns the hand to the lamplight, as if reading it."),_n("A long life line. I checked. I always check now.")],
    [_n("Three hundred years of tea, and it took a human to make it taste of anything."),_h("That's the nicest thing anyone's said to me."),_n("I have a hundred more. I'll ration them.")],
    [_x("Aelira kisses your knuckles, then your brow, very gravely, like a blessing."),_n("Go. Climb. Come back to me. That's the whole prescription.")],
    [_n("When the tower is gone I want to show you the moonwells of my people. All of them. It will take decades. Good.")]]]},
 vivienne:{up:[null,
   [_x("Vivienne hands you a parcel wrapped in tissue and tied with silver thread."),_n("A scarf. Your colour. I'd been thinking about what your colour was, and then I couldn't stop."),_h("You made this for me?"),_n("I make things for everyone. I don't usually think about them afterwards.")],
   [_x("On the rooftop, Vivienne drapes her own coat over your shoulders against the wind and keeps her hands on the lapels."),_n("There. Look at you. You wear things as if you'd forgotten they were on. It's maddening. It's charming."),_h("Which one?"),_n("Both. I'm blushing, aren't I. I never blush. I'm blaming the cold."),_x("She doesn't let go of the lapels, and she doesn't step back.")],
   [_x("In her tidy townhouse, Vivienne straightens your collar, then simply rests her palms flat against your chest."),_n("I've fitted a thousand coats. I always know exactly where everything should sit."),_n("And then there's you, and I've no idea what to do with my hands."),_h("You could hold mine."),_n("...Yes. That. Stay a while. Let me be untidy for once."),_x("She lifts her face and kisses you, soft and deliberate, a little star drawn at the bottom of a very long letter.")]],
  talk:[
   [[_n("Welcome. Do mind the pins. They have opinions.")],
    [_n("Climbers. Always torn. Always in a hurry. Always 'can you do it by tomorrow'.")],
    [_n("Hm. Your cuffs are a tragedy. Not a crime, quite. A tragedy.")],
    [_n("Prices are on the card. The card is not a suggestion.")],
    [_n("I don't do repairs on things that still have monster in them. Wash it first.")],
    [_n("Good day. If you need anything, I'll know before you do. It's the job.")]],
   [[_n("You came back. And you didn't touch the silk. I'm almost impressed.")],
    [_n("Stand up straight. You're slouching in my good mirror. It's bad for both of you.")],
    [_n("I kept your measurements. Purely professional. In a special notebook. With a ribbon on it."),_h("Is that professional?"),_n("It's organised. Hush.")],
    [_n("Someone asked if you were my apprentice. I said no, you're my mannequin. Hold still.")],
    [_n("You've got a pin in your sleeve. Mine, I assume. Keep it. Bring it back when it's earned interest.")],
    [_n("That colour's wrong on you. This one. ...Oh. Yes. Well. Never wear anything else in my presence.")]],
   [[_n("Arms up. Turn. Slower. ...I'm checking the seam. I'm absolutely checking the seam.")],
    [_x("Vivienne measures your shoulders twice, and the second time she isn't looking at the tape."),_n("Numbers can be wrong. One must be thorough.")],
    [_n("You look devastating in charcoal. I'm telling you as a professional. And as a woman with eyes.")],
    [_n("I drew you in my sketchbook. Only the coat. And the hands. And, fine, the face. The coat is very good.")],
    [_n("If you keep smiling at me like that, I'll have to charge you for the fitting. In dinners."),_h("How many?"),_n("I'll keep a tab. A long one.")],
    [_x("She fixes your collar, then lets her fingertips trail down your lapel."),_n("Perfect. Don't move. I want to remember it exactly.")]],
   [[_x("Vivienne meets you at the door, takes your face in both hands, and kisses you hello."),_n("There. Now I can concentrate on hemming.")],
    [_n("Stay a while. I've made too much tea and I want someone to watch me fuss over the cups.")],
    [_x("She walks beside you through the market with her arm through yours, chin high."),_n("Let them stare. We're the best-dressed couple in Cinderholt. Obviously.")],
    [_n("I sewed a star inside your coat, over the heart. Nobody will see it. That's rather the point.")],
    [_n("I used to think I'd only ever love beautiful things. I was right, of course. I just didn't know it'd be you.")],
    [_x("Vivienne rests against your shoulder on the window seat, shoes off, utterly untidy."),_n("Don't tell anyone I can relax. It'd ruin my reputation.")]]]},
 maid:{up:[null,
   [_x("Sylwen sets a second cup beside yours, then hesitates, and sits down to drink it with you."),_n("I hope that's permitted. I didn't ask the house. I asked myself."),_h("Stay."),_n("...Thank you. I believe I will.")],
   [_x("On the roof, Sylwen wraps her shawl around both your shoulders instead of just hers."),_n("It's a very large shawl. That's the only reason."),_h("Of course."),_n("And you were cold. And I wanted to sit closer. Those are also reasons. I find there are a great many reasons tonight."),_x("Her cheeks are warm when her face brushes yours. She doesn't apologise for it.")],
   [_x("In her plain room, Sylwen takes your hand and simply holds it in her lap, looking at it, as though it's something precious left in her care."),_n("I served this house for years without ever being anyone's. I didn't mind. I thought I didn't."),_n("Then you came, and you thanked me for the tea. Every time. Nobody thanks the tea."),_h("I'll thank it forever."),_n("Stay a while, then. Not as the master. As mine."),_x("She leans in and kisses you, gentle and certain, and for once she doesn't straighten anything afterwards.")]],
  talk:[
   [[_n("Your room is made up. The towels are on the left. The other left.")],
    [_n("Supper is at eight. If you're late, it will be at eight and cold.")],
    [_n("The house has stood for two hundred years. Please don't break it in one.")],
    [_n("I'll mend that. No, you don't need to thank me. It's my duty.")],
    [_n("Master. ...Sir. ...I'm still deciding what to call you.")],
    [_n("Wipe your boots. Both of them. I did say both.")]],
   [[_n("I made the scones you liked. I'm not saying I noticed you liked them. I'm saying there are scones.")],
    [_n("You hum when you're thinking. It's off key. I've grown used to it. That's all.")],
    [_n("If you peel, I'll talk. That's the bargain. ...You're peeling very slowly. Is that so I'll keep talking?")],
    [_n("Liraen says I smile when you come in. Liraen is mistaken. Liraen is frequently mistaken."),_h("You're smiling now."),_n("That's an entirely separate smile.")],
    [_n("I put a sprig of lavender under your pillow. For sleep. It's practical. Lavender is very practical.")],
    [_n("You may call me Sylwen. Only you. Only when the house is quiet.")]],
   [[_x("Sylwen fixes your collar and lets her hand rest on your chest a moment."),_n("There's a thread. ...There isn't. I wanted an excuse.")],
    [_n("I find myself setting your place before you've arrived. Then waiting by the door. It's undignified. I don't mind.")],
    [_n("You look well tonight. That's a professional assessment. My hands are only shaking because the teapot is heavy.")],
    [_n("The roof again? I'll bring the big shawl. We'll have to sit close. It's a very practical arrangement."),_h("Very practical."),_n("I'm glad we agree.")],
    [_n("Your hair's grown. I like it. I don't know why I said that out loud. Pretend I didn't.")],
    [_x("She lingers in the doorway after saying goodnight."),_n("...Goodnight. Again. I'm going. I'm going now. ...Goodnight.")]],
   [[_x("Sylwen meets you in the hall and holds you, quietly, her cheek against your shoulder."),_n("Welcome home. I've waited all day to say that properly.")],
    [_n("Stay a while. The house can keep itself for one evening. I've taught it well.")],
    [_x("She holds your hand on the walk upstairs, the way she once held a candle: carefully, so it won't go out.")],
    [_n("I don't need to be the maid with you. I'm just me. It's strange, being just me. It's lovely.")],
    [_x("Sylwen kisses you once, softly, then straightens your collar out of habit and laughs at herself."),_n("Some things never change.")],
    [_n("When the tower falls, I'd like a little garden. Two chairs. Yours on the left. The other left.")]]]},
 liraen:{up:[null,
   [_x("Liraen hands you a lantern at the door without a word, then falls into step beside you."),_n("You walk the wall with me tonight. I've decided. You can complain on the way."),_h("I won't complain."),_n("Pity. I was going to enjoy ignoring it.")],
   [_x("At the top of the watch tower, Liraen leans on the sill beside you, closer than the sill requires."),_n("I don't let people this close. It's a professional rule."),_h("And me?"),_n("You walked past the rule. Like it wasn't locked. I keep checking it, and it isn't."),_x("She bumps your shoulder with hers, eyes on the valley. The tips of her ears have gone pink. She'll deny it.")],
   [_x("In her small cottage, Liraen sets her ring of keys on the table, the first time you've seen her without them."),_n("Every door in that house, I hold the key. I've never given anyone one to me."),_n("So. Here."),_x("She presses something into your palm. It's not a key. It's her hand."),_n("Stay a while. I'll check the lock once. Just once. Then I'm not leaving this chair."),_x("She pulls you into her arms and kisses you, fierce and brief, and then holds on as if you might be lost on floor eleven.")]],
  talk:[
   [[_n("Name. Business. ...Fine. Don't touch the silver.")],
    [_n("I check every lock twice. Don't take it personally. I'd check you twice too.")],
    [_n("The master's guests don't wander. The master's guests have a very good sense of direction.")],
    [_n("I've worked worse houses. This one, at least, the ghosts pay rent.")],
    [_n("Mind the third stair. It squeaks. I like that it squeaks.")],
    [_n("Lamp's trimmed. Ledger's balanced. You're late. Two out of three.")]],
   [[_n("You came back in one piece. Good. Less paperwork.")],
    [_n("I left the side door on the latch. In case you're late. Don't make a habit of it. Make it a small habit.")],
    [_n("You scrubbed the step without being asked. Suspicious. Admirable. Mostly suspicious.")],
    [_n("Sylwen says I'm softer with you. Sylwen should mind her teapot."),_h("Are you?"),_n("Marginally. Don't push it.")],
    [_n("I counted the lights in the valley last night. There were four. One of them was your window.")],
    [_n("Walk the wall with me. You're decent company for someone who talks to swords.")]],
   [[_n("You've a scar on your jaw I haven't catalogued. Hold still. ...For the ledger.")],
    [_x("Liraen hands you the lantern and her fingers stay on the handle with yours."),_n("It's heavy. I'm helping.")],

/* ===================== v2.0.1 scene video loops, iPhone-Safari-proof =====================
   One way to mount a loop everywhere (#nscene and #dlg): muted + playsinline (+ webkit-playsinline) + autoplay + loop set as
   both properties and attributes BEFORE src, direct .mp4 src, load(), append, play(). No give-up timer: the portrait stays
   underneath until 'playing' fires and the loop is removed only on a real 'error'. Any tap re-kicks a paused loop
   (iOS Low Power Mode refuses autoplay until a user gesture). */
function mountLoop(host,vf,cls,onPlay,onDrop){
  const v=document.createElement('video');
  v.muted=true;v.defaultMuted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.preload='auto';
  ['muted','playsinline','webkit-playsinline','autoplay','loop'].forEach(a=>v.setAttribute(a,''));
  v.setAttribute('disablepictureinpicture','');v.setAttribute('aria-hidden','true');v.className=cls;
  if(SCENE_HAVE[vf+'.webp'])v.poster=vf+'.webp';
  v.addEventListener('playing',()=>{if(v.isConnected&&onPlay)onPlay(v);});
  v.addEventListener('error',()=>{if(onDrop)onDrop(v);});
  v.src=vf+'.mp4';v.load();host.appendChild(v);
  const p=v.play();if(p&&p.catch)p.catch(()=>{});
  return v;}
function kickLoops(root){if(!root)return;root.querySelectorAll('video').forEach(v=>{if(v.paused&&v.isConnected&&!v.error){const p=v.play();if(p&&p.catch)p.catch(()=>{});}});}
['click','touchend'].forEach(t=>document.addEventListener(t,ev=>{const r=ev.target&&ev.target.closest&&ev.target.closest('#nscene,#dlg');if(r)kickLoops(r);},{capture:true,passive:true}));
