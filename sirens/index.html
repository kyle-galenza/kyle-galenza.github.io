  }
  function say(text) { return String(text || "").replace(/\{name\}/g, state.name || "Ren"); }
  function isSide(id) { return /_lounge$|_stay$/.test(id || "") || id === "end_close" || id === "end_cool"; }
  function render(n) {
    $("nameplate").textContent = n.who || "";
    $("nameplate").style.color = GIRLS[n.girl] ? GIRLS[n.girl].color : "var(--gold)";
    $("line").textContent = say(n.text);
    var box = $("choices");

    var opts = (n.choices || []).filter(function (c) { return !c.need || bond >= c.need; });

  function go(id) {

  function pick(c) {

    go(c.to);
  }
  function advance() {

  function paintDrawer() {

    back.textContent = "Back to the Lounge";

  }
  function setFit(mode) {
    state.fits[state.girl] = mode;
    shown = "";
    showVisual(state.girl);
    save();
    paintDrawer();
  }
  function jumpGirl(k) {
    if (!state.free && !state.unlocked[k]) return;
    if (!isSide(state.node)) state.resume = state.node;
    $("drawer").hidden = true;
    go(k + "_lounge");
  }
  function showTitle() {
    document.body.classList.remove("playing", "choosing");
    $("title").hidden = false;
    $("box").hidden = true;
    $("spark").hidden = true;
    $("drawer").hidden = true;
    $("btnCont").hidden = !loadSave();

  }
  function begin(fromSave) {
    var typed = ($("you").value || "").trim() || "Ren";
    $("you").blur();

  }
  function boot() {

    preload();
    syncViewport();
    document.addEventListener("focusout", pinAfterBlur, true);
    window.addEventListener("resize", syncViewport);
    window.addEventListener("orientationchange", syncViewport);

    var lastSpark = 0;
    $("spark").addEventListener("pointerup", function (e) {
      var now = Date.now();
      if (now - lastSpark < 250) return;
      lastSpark = now;
      if (e.cancelable) e.preventDefault();

      d.hidden = !d.hidden;
      if (!d.hidden) paintDrawer();
    });

      begin(false);
    });
    $("btnCont").addEventListener("pointerup", function (e) {
      if (e.cancelable) e.preventDefault();
      begin(true);
    });
    $("btnCont").hidden = !loadSave();
    showTitle();
  }
  if (document.documentElement.dataset.unlocked === "1") { boot(); }
  var form = $("lockForm");
  var pw = $("lockPw");
  var show = $("lockShow");
  var err = $("lockErr");
  var age = $("lockAge");

  window.addEventListener("resize", syncViewport);
  window.addEventListener("orientationchange", syncViewport);

  document.addEventListener("focusout", pinAfterBlur, true);

})();
