<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1220">
<title>Six for Sorrow</title>
<style>
:root{
  --bg:#1c1220;--ink:#f3e8d6;--dim:#b9a99a;--mute:#8d7d78;--sun:#ff9a4a;--sun2:#ffcf7a;--blood:#d4313f;--gold:#f0b54c;
  --glass:rgba(40,24,38,.62);--line:rgba(255,220,180,.14);
  --c0:#c8bcaa;--c1:#72d39a;--c2:#62adff;--c3:#ffb347;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.35 system-ui,-apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1);transform:scale(1.02)}
.screen.on{opacity:1;pointer-events:auto;transform:none}
canvas.bg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- island (alerts grow out of the pill) ---------- */
#island{position:fixed;z-index:60;top:calc(var(--st) + 10px);left:50%;transform:translateX(-50%);height:34px;min-width:110px;border-radius:17px;background:rgba(22,12,20,.78);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:width .42s cubic-bezier(.3,1.3,.5,1),height .42s cubic-bezier(.3,1.3,.5,1),border-radius .42s,border-color .3s,opacity .35s;white-space:nowrap}
#island.hide{opacity:0;pointer-events:none}
#island .b,#island .a{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1)}
#island .b{font:700 12px/1 system-ui;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
#island .a{opacity:0;transform:scale(.8);font:800 15px/1.2 system-ui;color:#fff;white-space:normal;text-align:center}
#island.alert.tall{height:64px;border-radius:26px}
#island.tall .a{font-size:14px;padding:0 14px}
#island.alert{height:48px;border-radius:24px}
#island.alert .b{opacity:0;transform:scale(.8)}
#island.alert .a{opacity:1;transform:none;transition-delay:.12s}

/* ---------- top bar ---------- */
.topbar{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 8px) 12px 8px;display:flex;align-items:center;justify-content:space-between;z-index:20;pointer-events:none}
.topbar>*{pointer-events:auto}
.ibtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);transition:transform .15s}
.ibtn:active{transform:scale(.92)}
.cnt{height:36px;padding:0 12px 0 8px;border-radius:18px;display:flex;align-items:center;gap:6px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);font:800 15px/1 system-ui;font-variant-numeric:tabular-nums}
.cnt .coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a0,#e2a33a 60%,#9b6420);box-shadow:inset 0 0 0 2px rgba(120,70,20,.5);display:grid;place-items:center;font:900 11px/1 Georgia,serif;color:#6b3f10}
.bump{animation:bump .26s ease}
@keyframes bump{50%{transform:scale(1.18)}}
.cnts{display:flex;gap:6px}
.hpchip{color:#ffb4b4}
.hpchip .hd{width:12px;height:12px;border-radius:50%;background:var(--blood);box-shadow:0 0 8px var(--blood)}

/* ---------- title ---------- */
#title .wrap{position:absolute;left:0;right:0;bottom:0;top:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px calc(var(--sb) + 26px)}
.logo{position:absolute;top:calc(var(--st) + 13vh);left:0;right:0;text-align:center}
.logo .k{font:700 12px/1 system-ui;letter-spacing:.42em;color:var(--sun2);opacity:.85;text-indent:.42em}
.logo h1{font:900 54px/.9 system-ui,-apple-system,sans-serif;letter-spacing:-.035em;margin-top:14px;color:#fff3e2;text-shadow:0 4px 30px rgba(255,120,60,.35)}
.logo h1 em{display:block;font-style:normal;font-weight:300;font-size:22px;letter-spacing:.32em;text-indent:.32em;color:var(--sun2);margin:6px 0}
.logo p{margin:16px auto 0;max-width:310px;padding:10px 14px;border-radius:18px;color:var(--ink);font:italic 500 14px/1.45 Georgia,serif;text-shadow:0 1px 2px rgba(10,4,10,.95),0 0 14px rgba(20,8,20,.9);background:rgba(28,12,30,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.btn{height:56px;border-radius:28px;padding:0 26px;display:flex;align-items:center;justify-content:center;gap:10px;font:800 16px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;transition:transform .14s,opacity .2s,filter .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(180deg,#ffb36a,#f07a35);color:#2a1208;box-shadow:0 10px 30px rgba(240,122,53,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.sec{background:rgba(255,240,220,.08);border:1px solid var(--line);color:var(--ink)}
.btn.blood{background:linear-gradient(180deg,#e8505c,#a81e2c);color:#fff;box-shadow:0 10px 30px rgba(200,30,45,.35)}
.btn[disabled]{opacity:.38;filter:saturate(.3);pointer-events:none}
.tbtns{width:100%;max-width:340px;display:grid;gap:12px}
.tbtns .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#ver{margin-top:16px;color:var(--mute);font:600 11px/1 system-ui;letter-spacing:.14em;padding:10px 16px;border-radius:14px}
.runinfo{color:var(--dim);font:600 12px/1.3 system-ui;letter-spacing:.06em;text-align:center;margin-bottom:12px;min-height:16px}

/* ---------- map ---------- */
#mapScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
#mapScroll::-webkit-scrollbar{display:none}
#mapInner{position:relative;width:100%}
#mapSvg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:grid;place-items:center;background:rgba(36,22,32,.86);border:2px solid rgba(255,220,180,.22);color:var(--dim);transition:transform .3s cubic-bezier(.3,1.4,.5,1),border-color .3s,background .3s,opacity .3s}
.node svg{width:26px;height:26px}
.node.done{opacity:.45;background:rgba(36,22,32,.6)}
.node.here{border-color:var(--sun);color:var(--sun2);opacity:1}
.node.open{border-color:var(--sun2);color:#fff;background:rgba(80,40,30,.9);animation:pulse 1.6s ease-in-out infinite}
.node.locked{opacity:.55}
.node.boss{width:84px;height:84px;margin:-42px 0 0 -42px;border-color:rgba(212,49,63,.6);color:#ff8a8a}
.node.boss svg{width:38px;height:38px}
.node.boss.open{border-color:var(--blood);background:rgba(90,16,24,.9)}
.node .lb{position:absolute;top:100%;margin-top:5px;font:700 10px/1 system-ui;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;color:var(--dim);opacity:0;transition:opacity .3s}
.node.open .lb,.node.boss .lb{opacity:1}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,190,110,.5)}50%{box-shadow:0 0 0 10px rgba(255,190,110,0)}}
.maptitle{position:absolute;left:0;right:0;text-align:center;font:900 30px/1 system-ui;letter-spacing:-.02em;color:#fff1de}
.maptitle small{display:block;font:700 11px/1 system-ui;letter-spacing:.32em;color:var(--sun2);margin-top:8px}
#mapBottom{position:absolute;left:12px;right:12px;bottom:calc(var(--sb) + 12px);z-index:20;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:24px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line)}
#mapBottom .mini{display:flex;gap:4px}
.hint{flex:1;color:var(--dim);font:600 12px/1.3 system-ui}

/* ---------- battle ---------- */
#battle canvas.bg{touch-action:none}
#bPanel{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(var(--sb) + 14px);background:linear-gradient(180deg,rgba(28,16,26,.55),rgba(22,12,20,.82));-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);border-top:1px solid var(--line);border-radius:26px 26px 0 0;z-index:10}
.pstat{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hpbar{flex:1;height:22px;border-radius:11px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.hpbar i{position:absolute;left:0;top:0;bottom:0;border-radius:11px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.hpbar .lag{background:#ffd2a8;opacity:.6;transition:width .7s .25s ease}
.hpbar .fill{background:linear-gradient(90deg,#b4202e,#f05656)}
.hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 12px/1 system-ui;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.blk{height:30px;min-width:30px;padding:0 8px;border-radius:15px;display:flex;align-items:center;gap:4px;background:rgba(150,190,255,.14);color:#bcd6ff;font:800 13px/1 system-ui;transition:opacity .25s,transform .25s}
.blk.z{opacity:.25}
.gritbox{display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 6px 4px;border-radius:10px;border:1px solid transparent;transition:border-color .25s,background .25s}
.gritbox.ready{border-color:rgba(255,190,110,.6);background:rgba(255,150,60,.12)}
.gritbox small{font:800 11px/1 system-ui;letter-spacing:.14em;color:var(--dim)}
.gritbox.ready small{color:var(--sun2)}
.grit{display:flex;gap:4px;align-items:center}
.grit b.spend{animation:spend .5s ease}
@keyframes spend{40%{transform:scaleY(1.25);background:#fff}}
.grit b{width:12px;height:16px;border-radius:4px;background:rgba(255,255,255,.08);transition:background .25s,box-shadow .25s}
.grit b.on{background:linear-gradient(180deg,#ffd27a,#ff8a3a);box-shadow:0 0 10px rgba(255,150,60,.6)}
.bmain{display:flex;gap:12px;align-items:stretch}
#cylWrap{width:168px;height:168px;flex:none;position:relative}
#cyl{position:absolute;inset:0;transition:transform .42s cubic-bezier(.3,1.25,.5,1)}
#cylFrame{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5a4a4e,#2a1f26 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.15),inset 0 -6px 18px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4)}
.ch{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 45% 40%,#1a1216,#0b0709);box-shadow:inset 0 3px 6px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.12)}
.ch .rd{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:transform .3s cubic-bezier(.3,1.4,.5,1),opacity .3s;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),inset 0 2px 2px rgba(255,255,255,.45)}
.ch .rd svg{width:20px;height:20px}
.ch.spent .rd{transform:scale(.45);opacity:.25}
.ch.cur::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--sun2);box-shadow:0 0 12px rgba(255,200,120,.6)}
#hammer{position:absolute;left:50%;top:-10px;width:0;height:0;margin-left:-8px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid var(--sun2);filter:drop-shadow(0 0 4px rgba(255,180,90,.8));z-index:3}
#cylHub{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8a7676,#3a2c30);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;transition:filter .3s,opacity .3s;z-index:2}
#cylHub b{font:900 11px/1 system-ui;letter-spacing:.06em;color:#ffe2b0}
#cylHub i{font:900 15px/1 system-ui;font-style:normal;color:#fff;margin-top:1px}
#cylHub.used{filter:grayscale(1) brightness(.75)}
#cylHub.used b,#cylHub.used i{color:#cfc4bc}
#cyl.canspin .ch:not(.spent):not(.cur){cursor:pointer;animation:wob 1.8s ease-in-out infinite}
#cyl.canspin .ch:not(.spent):not(.cur)::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:1.5px dashed rgba(255,207,122,.55)}
@keyframes wob{0%,100%{scale:1}50%{scale:1.06}}
.abtn .cost{display:flex;gap:2px}.abtn .cost b{width:5px;height:7px;border-radius:2px;background:rgba(255,255,255,.18)}.abtn .cost b.on{background:#ffb347}
 #fireBtn small{display:none;font:700 11px/1 system-ui;letter-spacing:.04em;text-transform:none;color:var(--dim)}
#fireBtn.empty{opacity:1!important;filter:none!important;background:rgba(0,0,0,.22);box-shadow:none;border:1.5px dashed rgba(255,190,110,.6);color:var(--sun2);flex-direction:column;gap:4px}
#fireBtn.empty small{display:block}
.abtn.hint{border-color:rgba(255,190,110,.75);color:#fff;background:rgba(255,150,60,.2);box-shadow:0 0 12px rgba(255,150,60,.35)}
.abtn.full{opacity:1!important;color:var(--dim);background:rgba(0,0,0,.18);border-style:dashed}
.bside{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.rinfo{min-height:44px}
.rinfo b{display:block;font:800 15px/1.1 system-ui}
.rinfo small{display:block;color:var(--dim);font:500 12px/1.3 system-ui;margin-top:3px}
#fireBtn{height:62px;border-radius:20px;font-size:20px;letter-spacing:.14em}
.brow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.abtn{height:50px;border-radius:16px;background:rgba(255,240,220,.08);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 11px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;transition:transform .14s,opacity .2s,background .2s}
.abtn:active{transform:scale(.94)}
.abtn svg{width:18px;height:18px}
.abtn[disabled]{opacity:.32;pointer-events:none}
.abtn.ready{background:linear-gradient(180deg,rgba(255,170,80,.35),rgba(240,100,40,.25));border-color:rgba(255,190,110,.6);color:#fff}
#tapHint{position:absolute;left:0;right:0;text-align:center;font:700 11px/1 system-ui;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;pointer-events:none;transition:opacity .4s}
#bMenu{position:absolute;left:12px;top:calc(var(--st) + 8px);z-index:20}
.fx{position:fixed;pointer-events:none;z-index:70}
.dmg{font:900 22px/1 system-ui;color:#fff;text-shadow:0 2px 0 #5a0d14,0 0 12px rgba(220,40,50,.8);transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s}
.dmg.heal{color:#a8ffbf;text-shadow:0 2px 0 #0d4a22}
.dmg.pl{color:#ffb0b0}
.dmg.blkd{color:#bcd6ff;text-shadow:0 2px 0 #1c2e52}
.coinfx{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a0,#e2a33a 60%,#9b6420);box-shadow:0 0 10px rgba(255,200,90,.7)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:50;background:radial-gradient(circle at 50% 100%,rgba(255,60,60,.0),rgba(170,0,20,.55));opacity:0;transition:opacity .4s}

/* ---------- sheets ---------- */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(14,6,12,.5);-webkit-backdrop-filter:blur(14px) saturate(120%);backdrop-filter:blur(14px) saturate(120%);opacity:0;pointer-events:none;transition:opacity .35s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:45;max-height:88%;overflow-y:auto;overscroll-behavior:contain;padding:10px 18px calc(var(--sb) + 18px);border-radius:28px 28px 0 0;background:linear-gradient(180deg,rgba(64,42,56,.94),rgba(40,26,36,.97));border-top:1px solid rgba(255,220,180,.2);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.25,1);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 12px}
.sh-k{font:700 11px/1 system-ui;letter-spacing:.24em;color:var(--sun2);text-transform:uppercase;text-align:center}
.sh-t{font:900 26px/1.05 system-ui;letter-spacing:-.02em;text-align:center;margin:8px 0 6px}
.sh-p{color:var(--dim);text-align:center;font:500 14px/1.45 system-ui;margin:0 auto 14px;max-width:330px}
.sh-p.q{font:italic 500 15px/1.5 Georgia,serif;color:#e8d8c4}
.opts{display:grid;gap:10px;margin:6px 0 12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:20px;background:rgba(255,240,220,.06);border:1px solid var(--line);transition:transform .15s,background .2s,border-color .2s,opacity .35s,translate .45s cubic-bezier(.2,.9,.25,1);min-height:72px}
.opt:active{transform:scale(.97)}
.opt .ic{width:50px;height:50px;border-radius:14px;flex:none;display:grid;place-items:center;background:rgba(0,0,0,.25)}
.opt .ic svg{width:26px;height:26px}
.opt .tx{flex:1;min-width:0}
.opt .tx b{display:block;font:800 16px/1.15 system-ui}
.opt .tx small{display:block;color:var(--dim);font:500 13px/1.35 system-ui;margin-top:3px}
.opt .tx .rt{font:800 10px/1 system-ui;letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px;display:block}
.opt .pr{font:800 15px/1 system-ui;display:flex;align-items:center;gap:5px;color:var(--gold)}
.opt.na{pointer-events:none;border-style:dashed;background:rgba(0,0,0,.14)}
.opt.na .tx b{color:var(--dim)}
.opt.cant{pointer-events:none;border-style:dashed;background:rgba(0,0,0,.14)}
.opt .need{display:flex;align-items:center;gap:4px;font:800 12px/1.1 system-ui;color:#ffb0a0;text-align:right}
.opt .need svg{width:15px;height:15px}
.opt.cant .pr{color:var(--dim)}
.opt.picked{border-color:var(--sun2);background:rgba(255,190,110,.14)}
.sh-btns{display:grid;gap:10px;margin-top:6px}
.sh-btns .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r0{color:var(--c0)}.r1{color:var(--c1)}.r2{color:var(--c2)}.r3{color:var(--c3)}
/* big cylinder in chamber-pick */
.bigcyl{position:relative;width:250px;height:250px;margin:6px auto 14px}
.bigcyl .ch{width:72px;height:72px;margin:-36px 0 0 -36px;cursor:pointer}
.bigcyl .ch .rd{width:56px;height:56px}
.bigcyl .ch .rd svg{width:26px;height:26px}
.bigcyl .ch.sel::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--sun2)}
.newround{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 12px}
.chip{padding:7px 11px;border-radius:14px;background:rgba(255,240,220,.07);border:1px solid var(--line);font:700 12px/1 system-ui}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.statrow div{padding:10px 6px;border-radius:16px;background:rgba(255,240,220,.06);text-align:center}
.statrow b{display:block;font:900 20px/1 system-ui}
.statrow small{display:block;color:var(--dim);font:700 10px/1 system-ui;letter-spacing:.12em;margin-top:5px;text-transform:uppercase}
.sec-h{font:800 11px/1 system-ui;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin:12px 2px 8px}

/* ---------- carousels (heirloom pick + armory): next card peeks ---------- */
.car{display:grid;grid-auto-flow:column;grid-auto-columns:66%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;margin:0 -18px;padding-left:18px;scroll-padding-left:18px;scrollbar-width:none;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.car::after{content:"";width:1px}
.hcard{scroll-snap-align:start;border-radius:24px;padding:16px;background:linear-gradient(180deg,rgba(255,240,220,.09),rgba(255,240,220,.03));border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-height:250px;transition:transform .2s,border-color .25s,background .25s}

<script>
(() => {
'use strict';
const KA_GAME='six-for-sorrow', KA_VERSION='1.0';
/* KA_TELEMETRY_START */
// Shared anonymous play-log module. No personal data.
// TELEMETRY_URL is the ntfy.sh topic. Messages over 4096 bytes become attachments,
// so the wire payload is a compact run summary (short keys, no events[], capped picks).
// The full run (including events) stays in localStorage.
const TELEMETRY_URL = 'https://ntfy.sh/ka-tlm-7f0exmas';
const TELEMETRY_LS_ID = 'kylearcade_pid';
const TELEMETRY_LS_RUNS = 'kylearcade_runs';
const TELEMETRY_CAP = 200;
const TELEMETRY_WIRE_MAX = 3800;
const KATel = (() => {
  const uid = () => {
    try {
      let id = localStorage.getItem(TELEMETRY_LS_ID);
      if (!id) {
        id = (crypto && crypto.randomUUID) ? crypto.randomUUID()
          : ('k'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
        localStorage.setItem(TELEMETRY_LS_ID, id);
      }
      return id;
    } catch (e) { return 'anon'; }
  };
  const readRuns = () => {
    try { return JSON.parse(localStorage.getItem(TELEMETRY_LS_RUNS) || '[]') || []; }
    catch (e) { return []; }
  };
  const writeRuns = (runs) => {
    try {
      if (runs.length > TELEMETRY_CAP) runs = runs.slice(runs.length - TELEMETRY_CAP);
      localStorage.setItem(TELEMETRY_LS_RUNS, JSON.stringify(runs));
    } catch (e) {}
  };
  const nowIso = () => new Date().toISOString();
  const tOf = (run) => Math.round(((Date.now() - run._t0) / 1000) * 10) / 10;
  const snapshot = (run) => {
    const o = {
      id: run.id,
      playerId: run.playerId,
      game: run.game,
      version: run.version,
      date: run.date,
      duration: tOf(run),
      level: run.level || 0,
      wave: run.wave || 0,
      result: run.result || 'in_progress',
      cause: run.cause || '',
      picks: run.picks,
      coinsEarned: run.coinsEarned || 0,
      coinsSpent: run.coinsSpent || 0,
      peakArmy: run.peakArmy || 0,
      kills: run.kills || 0,
      sent: run.sent || 0,
      events: run.events,
      upgrades: run.upgrades || null,
      loadout: run.loadout || null,
      final: !!run.final,
      cls: run.cls || '', gp: run.gp || 0, startFloor: run.startFloor || 0, bestFloor: run.bestFloor || 0
    };
    return o;
  };
  const compactPicks = (picks, cap) => {
    const src = Array.isArray(picks) ? picks.slice(-cap) : [];
    return src.map(p => {
      if (!p || typeof p !== 'object') return p;
      const o = { t: p.t, k: p.kind || p.k, i: p.id || p.i };
      if (p.rarity || p.r) o.r = p.rarity || p.r;
      if (p.lvl != null) o.lv = p.lvl;
      else if (p.lv != null) o.lv = p.lv;
      return o;
    });
  };
  const compactBody = (snap) => {
    const build = (pickCap, withU, withLd) => {
      const o = {
        i: snap.id,
        p: snap.playerId,
        g: snap.game,
        v: snap.version,
        d: snap.date,
        t: snap.duration,
        l: snap.level || 0,
        w: snap.wave || 0,
        r: snap.result,
        c: snap.cause || '',
        pk: compactPicks(snap.picks, pickCap),
        ce: snap.coinsEarned || 0,
        cs: snap.coinsSpent || 0,
        pa: snap.peakArmy || 0,
        k: snap.kills || 0,
        s: snap.sent || 0,
        f: snap.final ? 1 : 0
      };
      if (snap.cls) o.cl = snap.cls;
      o.gp = snap.gp || 0; o.sf = snap.startFloor || 0; o.bf = snap.bestFloor || 0;
      if (withU && snap.upgrades) o.u = snap.upgrades;
      if (withLd && snap.loadout) o.ld = snap.loadout;
      return o;
    };
    let cap = 12, withU = true, withLd = true;
    let body = JSON.stringify(build(cap, withU, withLd));
    while (body.length > TELEMETRY_WIRE_MAX) {
      if (cap > 6) cap = 6;
      else if (cap > 3) cap = 3;
      else if (withU) withU = false;
      else if (withLd) withLd = false;
      else if (cap > 0) cap = 0;
      else {
        const o = build(0, false, false);
        o.c = String(o.c || '').slice(0, 24);
        delete o.d;
        body = JSON.stringify(o);
        if (body.length > TELEMETRY_WIRE_MAX) {
          delete o.p;
          body = JSON.stringify(o);
        }
        break;
      }
      body = JSON.stringify(build(cap, withU, withLd));
    }
    return body;
  };
  const sentIds = new Set();
  const send = (payload) => {
    if (!TELEMETRY_URL || !payload) return;
    if (payload.id && sentIds.has(payload.id)) return;
    try {
      const body = compactBody(payload);
      if (payload.id) sentIds.add(payload.id);
      let ok = false;
      try {
        if (navigator.sendBeacon) {
          ok = navigator.sendBeacon(TELEMETRY_URL, new Blob([body], { type: 'text/plain' }));
        }
      } catch (e) { ok = false; }
      if (!ok) {
        fetch(TELEMETRY_URL, { method: 'POST', body, keepalive: true, mode: 'cors' }).catch(() => {});
      }
    } catch (e) {}
  };
  const persist = (run, doSend) => {
    if (!run) return;
    const snap = snapshot(run);
    const runs = readRuns();
    const i = runs.findIndex(r => r.id === snap.id);
    if (i >= 0) runs[i] = snap; else runs.push(snap);
    writeRuns(runs);
    if (doSend) send(snap);
  };
  let cur = null;
  const api = {
    playerId: uid,
    current: () => cur,
    startRun(extra) {
      cur = {
        id: (crypto && crypto.randomUUID) ? crypto.randomUUID()
          : ('r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)),
        playerId: uid(),
        game: (typeof KA_GAME !== 'undefined' ? KA_GAME : 'unknown'),
        version: (typeof KA_VERSION !== 'undefined' ? KA_VERSION : '0'),
        date: nowIso(),
        _t0: Date.now(),
        level: 0, wave: 0,
        result: 'in_progress', cause: '',
        picks: [], events: [],
        coinsEarned: 0, coinsSpent: 0,
        peakArmy: 0, kills: 0, sent: 0,
        upgrades: null, loadout: null, final: false
      };
      if (extra) Object.assign(cur, extra);
      api.event('run_start', extra || {});
      persist(cur, false);
      return cur;
    },
    event(name, data) {
      if (!cur) return;
      const ev = Object.assign({ t: tOf(cur), name }, data || {});
      cur.events.push(ev);
      if (cur.events.length > 80) cur.events.splice(0, cur.events.length - 80);
    },
    pick(kind, id, extra) {
      if (!cur) return;
      const p = Object.assign({ t: tOf(cur), kind, id }, extra || {});
      cur.picks.push(p);
      api.event('pick', p);
    },
    coins(earned, spent) {
      if (!cur) return;
      if (earned) cur.coinsEarned += earned;
      if (spent) cur.coinsSpent += spent;
    },
    set(k, v) { if (cur) cur[k] = v; },
    max(k, v) { if (cur && (v || 0) > (cur[k] || 0)) cur[k] = v; },
    finish(result, cause) {
      if (!cur) return;
      cur.result = result || 'unknown';
      cur.cause = cause || '';
      cur.final = true;
      cur.duration = tOf(cur);
      api.event('run_end', { result: cur.result, cause: cur.cause });
      persist(cur, true);
      const done = cur;
      cur = null;
      return done;
    },
    checkpoint(tag) {
      if (!cur) return;
      const snap = snapshot(cur);
      snap.id = cur.id + '-' + tag;
      snap.result = tag.replace(/[0-9]+$/, '') || 'checkpoint';
      snap.final = false;
      send(snap);
    },
    flush() {
      if (!cur) return;
      if (!cur.final && (cur.result === 'in_progress' || !cur.result)) {
        cur.result = 'quit';
        if (!cur.cause) cur.cause = 'hidden';
      }
      persist(cur, true);
    },
    exportLogs() {
      const data = { playerId: uid(), exported: nowIso(), runs: readRuns() };
      const text = JSON.stringify(data, null, 2);
      const ok = () => { try { if (typeof showIsland === 'function') showIsland('Logs copied'); } catch (e) {} };
      const fallback = () => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text; ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
          document.body.appendChild(ta); ta.focus(); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta); ok();
        } catch (e) { console.log('telemetry export', data); }
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(ok).catch(fallback);
        } else fallback();
      } catch (e) { fallback(); }
      return data;
    },
    bindVersionExport(el) {
      if (!el) return;
      let timer = 0, startX = 0, startY = 0;
      const down = (e) => {
        const t = e.touches ? e.touches[0] : e;
        startX = t.clientX; startY = t.clientY;
        clearTimeout(timer);
        timer = setTimeout(() => { timer = 0; api.exportLogs(); }, 650);
      };
      const move = (e) => {
        const t = e.touches ? e.touches[0] : e;
        if (Math.hypot((t.clientX||0)-startX, (t.clientY||0)-startY) > 14) { clearTimeout(timer); timer = 0; }
      };
      const up = () => { clearTimeout(timer); timer = 0; };
      el.addEventListener('pointerdown', down);
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      el.addEventListener('contextmenu', (e) => e.preventDefault());
    }
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden) api.flush(); });
  window.addEventListener('pagehide', () => api.flush());
  return api;
})();
/* KA_TELEMETRY_END */
/* ================= DATA ================= */
const SAVE_KEY='kylearcade_six-for-sorrow_save';
const FAST=/[?&]fast/.test(location.search);
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let rnd=Math.random;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RAR=[{id:'common',n:'Common'},{id:'uncommon',n:'Uncommon'},{id:'rare',n:'Rare'},{id:'legendary',n:'Legendary'}];

/* rounds: d dmg, burn/venom stacks, heal, self (hp cost), stun, aoe, ric(ochet), hol(low x2) */
const ROUNDS={
  lead:    {n:'Lead',r:0,d:7,col:'#cdbba2',g:'lead'},
  buck:    {n:'Buckshot',r:0,d:4,aoe:1,col:'#d7a46a',g:'buck'},
  silver:  {n:'Silver',r:1,d:7,hol:1,col:'#dfe8f2',g:'silver'},
  hell:    {n:'Hellfire',r:1,d:4,burn:3,col:'#ff7a3a',g:'hell'},
  rattler: {n:'Rattler',r:1,d:3,venom:4,col:'#9fd45a',g:'rattler'},
  bone:    {n:'Bone',r:1,d:5,heal:3,col:'#efe3c8',g:'bone'},
  blood:   {n:'Blood',r:2,d:13,self:2,col:'#e2364a',g:'blood'},
  thunder: {n:'Thunder',r:2,d:9,stun:1,col:'#7fb8ff',g:'thunder'},
  ric:     {n:'Ricochet',r:2,d:7,ric:1,col:'#ffd45a',g:'ric'},

};
const PERKS={
  steady:  {n:'Steady Hand',r:0,max:3,d:'Every round hits +1 harder.'},
  gut:     {n:'Iron Gut',r:0,max:3,d:'+10 max HP and heal 10.'},

/* persistent end-of-run picks */
const HEIR={
  gravedig: {n:'Gravedigger .45',k:'iron',r:0,d:'Lead rounds hit +2 harder.',col:'#cdbba2'},
  sawback:  {n:'Sawback Scattergun',k:'iron',r:1,d:'Start with a Buckshot round. Buckshot hits +2 harder.',col:'#d7a46a'},
  widow:    {n:"Widow's Peacemaker",k:'iron',r:2,d:'Start with two Silver rounds in the cylinder.',col:'#dfe8f2'},
  preacher: {n:"Preacher's Colt",k:'iron',r:3,d:'Fan the Hammer costs 2 grit, and fanned shots hit at 85% instead of 70%.',col:'#ffd27a'},
  duster:   {n:'Bullet-Torn Duster',k:'gear',r:0,d:'+12 max HP.',col:'#b08a6a'},

  boots:    {n:'Snakeskin Boots',k:'gear',r:1,d:'Start every fight behind 8 block.',col:'#9fd45a'},

  teeth:    {n:'Jar of Gold Teeth',k:'relic',r:0,d:'+30% scrip from every fight.',col:'#f0b54c'},
  skull:    {n:'Coyote Skull',k:'relic',r:1,d:'Start every fight with 1 grit.',col:'#efe3c8'},

  knuckle:  {n:"Saint's Knucklebone",k:'relic',r:3,d:'Once per run, a killing blow leaves you at a third of your HP instead.',col:'#fff1b8'}
};
/* foes: moves cycle; p2 = boss phase two */
const FOES={
  drifter:{n:'Hollow Drifter',tag:'hollow',hp:20,moves:[['atk',5],['atk',5],['guard',6]]},
  coyote: {n:'Starved Coyote',tag:'beast',hp:11,moves:[['atk',3],['multi',2,2]]},

/* ================= HEIRLOOM / PERK HELPERS ================= */
const has=(R,h)=>R&&R.eq&&R.eq.indexOf(h)>=0;

function fanCost(R){return (pk(R,'glutton')||has(R,'preacher'))?2:3;}
function fanMult(R){return pk(R,'deadman')?1:has(R,'preacher')?.85:.7;}
function roundDmg(R,rd,foe){
  const D=ROUNDS[rd.id];let d=D.d*(rd.up?1.5:1)+pk(R,'steady');
  if(rd.id==='lead'&&has(R,'gravedig'))d+=2;
  if(rd.id==='buck'&&has(R,'sawback'))d+=2;

}
function roundDesc(R,rd){
  const D=ROUNDS[rd.id],u=rd.up?1.5:1,s=[];
  const d=Math.round(roundDmg(R,rd,null));
  s.push(D.aoe?`${d} to every enemy`:`${d} damage`);
  if(D.hol)s.push('double vs the Hollow');
  if(D.burn)s.push(`burn ${Math.round(D.burn*u)+(pk(R,'dust')?2:0)}`);
  if(D.venom)s.push(`venom ${Math.round(D.venom*u)+(pk(R,'dust')?2:0)}`);
  if(D.heal)s.push(`heal ${Math.round(D.heal*u)}`);
  if(D.self)s.push(`costs ${D.self} HP`);
  if(D.stun)s.push('stuns');
  if(D.ric)s.push(`bounces for ${d}`);

/* ================= RUN ================= */
function newRun(S){
  const eq=(S.eq||[]).slice(0,3);
  const R={v:1,eq,hp:64,max:64,scrip:20,perks:{},row:-1,col:-1,kills:0,fights:0,ups:0,used:{},earned:0,spent:0,
    cyl:[{id:'lead'},{id:'lead'},{id:'lead'},{id:'lead'},{id:'lead'},{id:'lead'}],map:genMap(),seenPost:0};
  if(eq.includes('duster')){R.max+=12;R.hp+=12;}
  let k=0;
  if(eq.includes('widow')){R.cyl[1]={id:'silver'};R.cyl[4]={id:'silver'};}
  if(eq.includes('sawback')){R.cyl[3]={id:'buck'};}
  return R;
}
function genMap(){
  const rows=[];
  for(let r=0;r<MAP_ROWS;r++){
    let n=r===0?3:r===MAP_ROWS-1?1:r===MAP_ROWS-2?3:ri(2,3);
    if(r===MAP_ROWS-1){rows.push([{t:'boss',c:1.5}]);continue;}
    const cols=n===3?[0.5,1.5,2.5]:(rnd()<.5?[0.8,2.2]:[1,2.4]);
    const row=cols.map(c=>({c,t:'fight'}));
    // node types
    row.forEach((nd,i)=>{
      if(r===0||r===1){nd.t='fight';return;}
      if(r===MAP_ROWS-2){nd.t='camp';return;}
      const w=[['fight',46],['odd',18],['post',r>=2?16:0],['camp',r>=3?12:0],['elite',r>=3?16:0]];
      let tot=w.reduce((a,b)=>a+b[1],0),x=rnd()*tot;for(const [t,v] of w){x-=v;if(x<0){nd.t=t;break;}}
    });
    if(r===1)row[0].t=row.length>2?'fight':'fight';
    if(r===2&&!row.some(n=>n.t==='odd'))row[row.length-1].t='odd';
    if(r===4&&!row.some(n=>n.t==='post'))row[0].t='post';
    if(r===5&&!row.some(n=>n.t==='elite'))row[row.length-1].t='elite';
    rows.push(row);
  }
  // links: each node links to nodes in next row within 1.3 column distance (always at least nearest)
  for(let r=0;r<MAP_ROWS-1;r++){
    rows[r].forEach(nd=>{
      const nx=rows[r+1];let l=nx.map((m,j)=>[j,Math.abs(m.c-nd.c)]).filter(x=>x[1]<=1.3).map(x=>x[0]);
      if(!l.length){let b=0;nx.forEach((m,j)=>{if(Math.abs(m.c-nd.c)<Math.abs(nx[b].c-nd.c))b=j;});l=[b];}
      nd.to=l;
    });
    // ensure every next node is reachable
    rows[r+1].forEach((m,j)=>{if(!rows[r].some(nd=>nd.to.includes(j))){let b=0;rows[r].forEach((nd,i)=>{if(Math.abs(nd.c-m.c)<Math.abs(rows[r][b].c-m.c))b=i;});rows[r][b].to.push(j);}});
  }
  return rows;
}
function openNodes(R){
  if(R.row<0)return R.map[0].map((_,i)=>[0,i]);
  if(R.row>=MAP_ROWS-1)return [];
  return R.map[R.row][R.col].to.map(j=>[R.row+1,j]);
}
function rollRar(el){const w=el?[30,42,22,6]:[62,29,8,1];let x=rnd()*100;for(let i=0;i<4;i++){x-=w[i];if(x<0)return i;}return 0;}
function rewardOpts(R,el,n=3){
  const out=[],seen=new Set();let guard=0;
  while(out.length<n&&guard++<80){
    const rr=rollRar(el);
    const isPerk=rnd()<.48;
    if(isPerk){
      const ids=Object.keys(PERKS).filter(p=>PERKS[p].r===rr&&pk(R,p)<PERKS[p].max&&!seen.has(p));
      if(!ids.length)continue;const id=pick(ids);seen.add(id);out.push({k:'perk',id,r:rr});
    }else{
      const ids=Object.keys(ROUNDS).filter(p=>ROUNDS[p].r===rr&&p!=='lead'&&!seen.has(p));
      if(!ids.length)continue;const id=pick(ids);seen.add(id);out.push({k:'round',id,r:rr});
    }
  }
  return out;
}
function applyPerk(R,id){
  R.perks[id]=(R.perks[id]||0)+1;R.ups++;
  if(id==='gut'){R.max+=10;R.hp=Math.min(R.max,R.hp+10);}
  if(id==='seventh'){R.cyl.push({id:'silver'});}
}
function heirOpts(S,won,row){
  const own=new Set(S.own||[]);let pool=Object.keys(HEIR).filter(h=>!own.has(h));
  if(!pool.length)return [];
  const out=[];const want=Math.min(3,pool.length);
  const minR=won?2:0;
  // weighted by progress; boss kill guarantees one rare-or-better if any remain
  const w=r=>[10,6+row,1+row*1.2,(won?6:0)+row*.4][r];
  if(won){const hi=pool.filter(h=>HEIR[h].r>=minR);if(hi.length){const h=pick(hi);out.push(h);pool=pool.filter(x=>x!==h);}}
  while(out.length<want){let tot=pool.reduce((a,h)=>a+w(HEIR[h].r),0),x=rnd()*tot;for(const h of pool){x-=w(HEIR[h].r);if(x<=0){out.push(h);pool=pool.filter(y=>y!==h);break;}}}
  return out;
}

/* ================= COMBAT ENGINE (pure; UI replays the event list) ================= */
function mkFoe(id,row,uid){
  const F=FOES[id],sc=F.boss?1:1+0.06*row;
  const hp=Math.round(F.hp*sc);
  return {id,uid,n:F.n,tag:F.tag,hp,max:hp,armor:F.armor||0,block:0,str:0,burn:0,venom:0,stun:0,mi:0,dm:F.boss?1:1+0.045*row,elite:!!F.elite,boss:!!F.boss,phase:1,dead:false};
}
function newBattle(R,kind,row){
  const enc=pick(ENC[kind]);let uid=0;
  const B={R,kind,row,foes:enc.map(id=>mkFoe(id,row,uid++)),uidN:0,
    p:{block:has(R,'boots')?8:0,grit:has(R,'skull')?1:0,bleed:0},
    ch:R.cyl.map(c=>({id:c.id,up:c.up||0,loaded:true})),ptr:0,thumbs:1,turn:1,shots:0,over:'',kills:0,tgt:0};
  B.uidN=uid;B.tgt=B.foes[0].uid;
  return B;
}
const alive=B=>B.foes.filter(f=>!f.dead);
function foeMoves(f){const F=FOES[f.id];return f.phase===2&&F.p2?F.p2:F.moves;}
function intent(f){const m=foeMoves(f)[f.mi%foeMoves(f).length];const k=m[0];
  const dmg=v=>Math.max(0,Math.round((v+f.str)*f.dm));
  if(k==='atk'||k==='feast')return {k,dmg:dmg(m[1]),x:1};
  if(k==='multi')return {k,dmg:dmg(m[1]),x:m[2]};
  return {k,v:m[1]||0};
}
function incoming(B){let t=0;alive(B).forEach(f=>{if(f.stun)return;const it=intent(f);if(it.dmg)t+=it.dmg*it.x;});return t;}
function nextLoaded(B){for(let i=0;i<B.ch.length;i++){const j=(B.ptr+i)%B.ch.length;if(B.ch[j].loaded)return j;}return -1;}
function loadedCount(B){return B.ch.filter(c=>c.loaded).length;}
function hurtFoe(B,f,raw,ev,src){
  if(f.dead)return 0;
  let d=Math.max(1,Math.round(raw)-f.armor);
  let bl=Math.min(f.block,d);f.block-=bl;d-=bl;
  f.hp-=d;
  ev.push({t:'fhit',u:f.uid,d,bl,hp:Math.max(0,f.hp),src});
  if(f.hp<=0){f.hp=0;f.dead=true;B.kills++;ev.push({t:'fdie',u:f.uid});
    const h=3*pk(B.R,'hound');if(h)healP(B,h,ev);}
  return d;
}
function healP(B,v,ev){const R=B.R;const a=Math.min(v,R.max-R.hp);if(a>0){R.hp+=a;ev.push({t:'pheal',v:a,hp:R.hp});}}
function hurtP(B,dmg,ev,src){
  const R=B.R;let bl=Math.min(B.p.block,dmg);B.p.block-=bl;let d=dmg-bl;
  R.hp-=d;ev.push({t:'phit',d,bl,hp:Math.max(0,R.hp),block:B.p.block,src});
  if(R.hp<=0){
    if(has(R,'knuckle')&&!R.used.knuckle){R.used.knuckle=1;R.hp=Math.ceil(R.max/3);ev.push({t:'revive',hp:R.hp});}
    else{R.hp=0;B.over='lose';B.killer=src;}
  }
}
function shoot(B,ci,tu,mult,ev,fan){
  const R=B.R,rd=B.ch[ci],D=ROUNDS[rd.id],u=rd.up?1.5:1;
  let tgt=B.foes.find(f=>f.uid===tu&&!f.dead)||alive(B)[0];if(!tgt)return;
  let m=mult;if(pk(R,'stand')&&R.hp<R.max*.35)m*=1.5;
  ev.push({t:'shot',ci,id:rd.id,u:tgt.uid,fan:!!fan});
  B.shots++;
  if(D.aoe){alive(B).forEach(f=>hurtFoe(B,f,roundDmg(R,rd,f)*m,ev,rd.id));}
  else{
    hurtFoe(B,tgt,roundDmg(R,rd,tgt)*m,ev,rd.id);
    const dust=pk(R,'dust')?2:0;
    if(!tgt.dead){
      if(D.burn){tgt.burn+=Math.round(D.burn*u)+dust;ev.push({t:'fstat',u:tgt.uid,s:'burn'});}
      if(D.venom){tgt.venom+=Math.round(D.venom*u)+dust;ev.push({t:'fstat',u:tgt.uid,s:'venom'});}
      if(D.stun){tgt.stun=1;ev.push({t:'fstat',u:tgt.uid,s:'stun'});}
    }
    if(D.ric){const o=alive(B).filter(f=>f.uid!==tgt.uid);const t2=o.length?pick(o):(tgt.dead?null:tgt);if(t2){ev.push({t:'ric',from:tgt.uid,u:t2.uid});hurtFoe(B,t2,roundDmg(R,rd,t2)*m,ev,rd.id);}}
  }
  if(D.heal)healP(B,Math.round(D.heal*u),ev);
  if(D.self){R.hp=Math.max(1,R.hp-D.self);ev.push({t:'pself',d:D.self,hp:R.hp});}
}
function retarget(B){if(!alive(B).some(f=>f.uid===B.tgt)){const a=alive(B);B.tgt=a.length?a[0].uid:-1;}}
function thumb(B,ci){
  if(B.over||B.thumbs<=0||!B.ch[ci]||!B.ch[ci].loaded||ci===nextLoaded(B))return false;
  B.ptr=ci;B.thumbs--;return true;
}
function act(B,a){
  const ev=[];if(B.over)return ev;
  const R=B.R;
  if(a==='fire'){
    const ci=nextLoaded(B);if(ci<0)return ev;
    let times=1;if(B.shots===0)times+=(pk(R,'hair')?1:0)+(has(R,'spurs')?1:0);
    for(let i=0;i<times&&alive(B).length;i++)shoot(B,ci,B.tgt,1,ev);
    B.ch[ci].loaded=false;B.ptr=(ci+1)%B.ch.length;
    B.p.grit=Math.min(3,B.p.grit+1);ev.push({t:'grit',v:B.p.grit});
  }else if(a==='reload'){
    const n=B.ch.filter(c=>!c.loaded).length;if(!n)return ev;
    B.ch.forEach(c=>c.loaded=true);B.ptr=0;ev.push({t:'reload',n});
    if(pk(R,'quick')){B.p.block+=6;ev.push({t:'pblock',v:B.p.block});}
    if(has(R,'rosary'))healP(B,2,ev);
  }else if(a==='cover'){
    B.p.block+=8+4*pk(R,'hide');ev.push({t:'pblock',v:B.p.block});
    B.p.grit=Math.min(3,B.p.grit+1);ev.push({t:'grit',v:B.p.grit});
  }else if(a==='fan'){
    const c=fanCost(R);if(B.p.grit<c||nextLoaded(B)<0)return ev;
    B.p.grit-=c;ev.push({t:'grit',v:B.p.grit});ev.push({t:'fan'});
    let ci;while((ci=nextLoaded(B))>=0&&alive(B).length){retarget(B);shoot(B,ci,B.tgt,fanMult(R),ev,true);B.ch[ci].loaded=false;B.ptr=(ci+1)%B.ch.length;}
  }else return ev;
  retarget(B);
  if(!alive(B).length){B.over='win';ev.push({t:'win'});return ev;}
  enemyPhase(B,ev);
  return ev;
}
function summon(B,ev){if(alive(B).length>=2)return;const f=mkFoe('choir',3,B.uidN++);B.foes.push(f);ev.push({t:'summon',u:f.uid});}
function enemyPhase(B,ev){
  ev.push({t:'eturn'});
  for(const f of B.foes.slice()){
    if(f.dead||B.over)continue;
    f.block=0;
    if(f.burn){hurtFoe(B,f,f.burn+f.armor,ev,'burn');f.burn--;if(f.dead)continue;}
    if(f.venom){hurtFoe(B,f,f.venom+f.armor,ev,'venom');f.venom--;if(f.dead)continue;}
    if(f.stun){f.stun=0;ev.push({t:'stunned',u:f.uid});f.mi++;continue;}
    const it=intent(f);ev.push({t:'fact',u:f.uid,k:it.k});
    if(it.k==='atk')hurtP(B,it.dmg,ev,f.id);
    else if(it.k==='multi'){for(let i=0;i<it.x&&!B.over;i++)hurtP(B,it.dmg,ev,f.id);}
    else if(it.k==='feast'){const before=B.R.hp;hurtP(B,it.dmg,ev,f.id);const got=Math.max(0,before-Math.max(0,B.R.hp));if(got){f.hp=Math.min(f.max,f.hp+got);ev.push({t:'fheal',u:f.uid,v:got,hp:f.hp});}}
    else if(it.k==='guard'||it.k==='burrow'){f.block=it.v;ev.push({t:'fblock',u:f.uid,v:f.block});}
    else if(it.k==='hymn'){alive(B).forEach(o=>o.str+=it.v);ev.push({t:'buff',v:it.v});}
    else if(it.k==='noose'){B.p.bleed+=it.v;ev.push({t:'pbleed',v:B.p.bleed});}
    else if(it.k==='sermon'){if((B.summons||0)<2&&alive(B).length<2){B.summons=(B.summons||0)+1;summon(B,ev);}else{f.block=10;ev.push({t:'fblock',u:f.uid,v:10});}}
    f.mi++;
    if(f.boss&&f.phase===1&&f.hp<=f.max*.5){f.phase=2;f.mi=0;ev.push({t:'phase',u:f.uid});}
  }
  // boss can cross 50% from player damage too
  B.foes.forEach(f=>{if(f.boss&&!f.dead&&f.phase===1&&f.hp<=f.max*.5){f.phase=2;f.mi=0;ev.push({t:'phase',u:f.uid});}});
  if(!alive(B).length&&!B.over){B.over='win';ev.push({t:'win'});return;}
  if(B.over)return;
  // player turn start
  B.p.block=0;
  if(B.p.bleed){hurtP(B,B.p.bleed,ev,'noose');B.p.bleed--;}
  B.thumbs=1;B.turn++;
  ev.push({t:'pturn',block:0});
}

function aiAct(B){

  // pick target: lowest effective hp, prefer hollow when silver is up
  const al=alive(B);
  let ci=nextLoaded(B);
  // thumb: line up the best round
  if(ci>=0&&B.thumbs>0){
    let best=ci,bv=-1;
    B.ch.forEach((c,i)=>{if(!c.loaded)return;const D=ROUNDS[c.id];let v=0;
      al.forEach(f=>{const d=roundDmg(R,c,f);v=Math.max(v,D.aoe?d*al.length:d+(D.burn||0)*1.5+(D.venom||0)*2+(D.ric&&al.length>1?d:0));});
      if(i===ci)v+=.5;if(v>bv){bv=v;best=i;}});
    if(best!==ci)thumb(B,best);
  }
  ci=nextLoaded(B);
  const rd=ci>=0?B.ch[ci]:null;
  let tg=al[0];al.forEach(f=>{const s=f.hp+f.block-(rd&&ROUNDS[rd.id].hol&&f.tag==='hollow'?99:0)-(f.boss?0:0);const st=tg.hp+tg.block-(rd&&ROUNDS[rd.id].hol&&tg.tag==='hollow'?99:0);if(s<st)tg=f;});
  B.tgt=tg.uid;
  if(ld===0)return inc>=B.R.hp*.5&&B.p.grit>=0&&B.R.hp<B.R.max*.6?(inc>14?'cover':'reload'):'reload';
  if(B.p.grit>=fanCost(R)&&ld>=3)return 'fan';

}

function simBattle(R,kind,row){
  const B=newBattle(R,kind,row);let t=0;
  while(!B.over&&t++<200){act(B,aiAct(B));}
  return B;
}
function simRun(S,o={}){
  const R=newRun(S);const log=[];
  while(R.row<MAP_ROWS-1){
    const op=openNodes(R);
    // choose node
    let best=op[0],bv=-1e9;
    op.forEach(([r,c])=>{const t=R.map[r][c].t;const hpf=R.hp/R.max;let v=0;
      if(t==='fight')v=5;if(t==='elite')v=hpf>.75?8:-4;if(t==='camp')v=hpf<.6?10:2;if(t==='post')v=R.scrip>=45?7:(hpf<.5&&R.scrip>=STITCH.price?6:1);if(t==='odd')v=4;if(t==='boss')v=100;
      v+=rnd();if(v>bv){bv=v;best=[r,c];}});
    R.row=best[0];R.col=best[1];const nd=R.map[R.row][R.col];
    if(nd.t==='fight'||nd.t==='elite'||nd.t==='boss'){
      const kind=nd.t==='fight'?(R.row<2?'easy':'norm'):nd.t;
      const B=simBattle(R,kind,R.row);R.kills+=B.kills;
      if(B.over!=='win'){log.push(`died r${R.row} ${nd.t} vs ${B.killer}`);return {won:0,row:R.row,cause:B.killer,R,log};}
      R.fights++;const sc=fightScrip(R,kind,R.row);R.scrip+=sc;R.earned+=sc;
      R.hp=Math.min(R.max,R.hp+6+(has(R,'hat')?6:0));
      if(nd.t==='boss')return {won:1,row:R.row,R,log};
      const ch=aiReward(R,rewardOpts(R,nd.t==='elite'));if(ch){if(ch.k==='perk')applyPerk(R,ch.id);else{R.cyl[aiReplace(R)]={id:ch.id};R.ups++;}}
    }else if(nd.t==='camp'){
      if(R.hp<R.max*.7)R.hp=Math.min(R.max,R.hp+Math.round(R.max*.4));else{const c=R.cyl.find(x=>!x.up&&x.id!=='lead')||R.cyl.find(x=>!x.up);if(c)c.up=1;}
    }else if(nd.t==='post'){
      if(R.hp<R.max*.6&&R.scrip>=STITCH.price){R.scrip-=STITCH.price;R.spent+=STITCH.price;R.hp=Math.min(R.max,R.hp+STITCH.heal);}
      const st=postStock(R).filter(x=>x.price<=R.scrip);const ch=aiReward(R,st);
      if(ch){R.scrip-=ch.price;R.spent+=ch.price;if(ch.k==='perk')applyPerk(R,ch.id);else{R.cyl[aiReplace(R)]={id:ch.id};R.ups++;}}
    }else if(nd.t==='odd'){
      const e=pick(ODD);const opt=e.o.filter(x=>!x.need||x.need(R));const x=R.hp>30?opt[0]:opt[opt.length-1];const res=x.f(R);
      if(res.round){R.cyl[aiReplace(R)]={id:res.round};}if(res.perk)applyPerk(R,res.perk);
    }
  }
  return {won:0,row:R.row,R,log};
}
function simCampaign(nRuns,seedEq){
  // a fresh player: every run ends with an heirloom pick (takes the first offered), equips best 3
  const S={own:[],eq:[]};const out=[];
  for(let i=0;i<nRuns;i++){
    const r=simRun(S);out.push({won:r.won,row:r.row,cause:r.cause||'',eq:S.eq.slice()});
    const ho=heirOpts(S,!!r.won,r.row);if(ho.length){const h=ho.sort((a,b)=>HEIR[b].r-HEIR[a].r)[0];S.own.push(h);
      S.eq=S.own.slice().sort((a,b)=>HEIR[b].r-HEIR[a].r).slice(0,3);}
  }
  return out;
}

    else if(e.t==='fdie'){const c=foeCenter(e.u);VS[e.u].dead=.01;bleed(c.x,c.y,26,1.8);SFX.die();if(Math.random()<.5&&!c.f.boss)showIsland(pick(KILL_BARKS),'#ffcf7a',{key:'bark'});await sleep(260);}
    else if(e.t==='fstat'){const c=foeCenter(e.u);floatText(c.x+(Math.random()-.5)*30,c.top-18,e.s.toUpperCase(),e.s==='burn'?'':'heal');await sleep(70);}
    else if(e.t==='pheal'){hp=e.hp;renderBattleHud(hp);const r=$('hpTxt').getBoundingClientRect();floatText(r.left+r.width/2,r.top-10,'+'+e.v,'heal');await sleep(90);}
    else if(e.t==='pself'){hp=e.hp;renderBattleHud(hp);}
    else if(e.t==='grit'){[...$('grit').children].forEach((g,i)=>g.classList.toggle('on',i<e.v));}
    else if(e.t==='reload'){SFX.reload();cylAngle-=360;renderBattleHud(hp);await sleep(420);}
    else if(e.t==='pblock'){B.p.block=e.v;SFX.block();const bk=$('blk');bk.classList.remove('z');bk.querySelector('span').textContent=e.v;bump(bk);await sleep(160);}
    else if(e.t==='fan'){[...$('grit').children].forEach(g=>{g.classList.remove('spend');void g.offsetWidth;g.classList.add('spend');});showIsland('Fan the hammer','#ffb347',{key:'fan',hold:900});await sleep(120);}
    else if(e.t==='eturn'){await sleep(260);}
    else if(e.t==='fact'){const v=VS[e.u];if(v)v.lunge=1;const c=foeCenter(e.u);
      if(e.k==='aim')floatText(c.x,c.top,'takes aim','');if(e.k==='hymn')floatText(c.x,c.top,'HYMN','');if(e.k==='sermon')floatText(c.x,c.top,'SERMON','');
      await sleep(e.k==='atk'||e.k==='multi'||e.k==='feast'?180:260);}
    else if(e.t==='phit'){hp=e.hp;if(e.d>0){SFX.hurt();shake=Math.max(shake,6+e.d*.4);$('flash').style.transition='none';$('flash').style.opacity=RM?.22:Math.min(1,.35+e.d/20);requestAnimationFrame(()=>{$('flash').style.transition='opacity .45s';$('flash').style.opacity=0;});}else SFX.block();
      B.p.block=e.block;renderBattleHud(hp);const r=$('hpTxt').getBoundingClientRect();floatText(r.left+r.width/2+(Math.random()-.5)*40,r.top-14,e.d?'-'+e.d:'blocked',e.d?'pl':'blkd');await sleep(170);}
    else if(e.t==='revive'){hp=e.hp;renderBattleHud(hp);showIsland("The Knucklebone cracks. Get up.",'#fff1b8',{hold:2000});await sleep(700);}
    else if(e.t==='fblock'){const c=foeCenter(e.u);floatText(c.x,c.top,'+'+e.v+' guard','blkd');await sleep(120);}
    else if(e.t==='buff'){if(e.u==null)showIsland('The choir sings. Everyone hits harder.','#ffb347',{key:'hymn'});await sleep(140);}
    else if(e.t==='summon'){VS[e.u]={slot:B.foes.length-1,dhp:B.foes.find(f=>f.uid===e.u).hp,hit:0,dead:0,lunge:0};
      // reuse a dead slot so new choirboys stand where the old ones fell
      const used=B.foes.filter(f=>!f.dead&&f.uid!==e.u).map(f=>VS[f.uid].slot);const free=(B.kind==='boss'?[1,2]:[0,1,2]).find(s=>!used.includes(s));VS[e.u].slot=free!=null?free:VS[e.u].slot;
      showIsland('A choirboy crawls out of the pews','#ffb347',{key:'summon'});await sleep(320);}
    else if(e.t==='phase'){SFX.boss();showIsland('He takes to the air. He is hungry.','#ff5a5a',{hold:2000});shake=10;await sleep(700);}
    else if(e.t==='stunned'){const c=foeCenter(e.u);floatText(c.x,c.top,'STUNNED','heal');await sleep(200);}
    else if(e.t==='pbleed'){showIsland('Rope burn. You\'re bleeding.','#ff8a8a',{key:'bleed'});await sleep(150);}
    else if(e.t==='fheal'){const c=foeCenter(e.u);VS[e.u].dhp=e.hp;floatText(c.x,c.top,'+'+e.v,'heal');await sleep(200);}
    else if(e.t==='pturn'){}
    else if(e.t==='win'){await sleep(250);}
  }
  renderBattleHud();
}
function setFireEmpty(on,others){const f=$('fireBtn');f.classList.toggle('empty',on);f.querySelector('.fl').textContent=on?'Empty':'Fire';f.querySelector('small').textContent=on?(others?'Spin or reload':'Reload to fire'):'';
  $('relBtn').classList.toggle('hint',on&&!busy);}
function renderCylShot(ci){if(ci===nextLoaded(B)||!B.ch[ci].loaded)setFireEmpty(true,loadedCount(B)>0);$('relBtn').classList.remove('full');$('relBtn').querySelector('.rl').textContent='Reload';const el=$('cyl').children[ci];if(el){el.classList.add('spent');const rd=el.firstChild;if(rd)rd.style.transform=`rotate(${-cylAngle}deg) scale(.45)`;}}

async function endFight(){
  R.kills+=B.kills;KATel.set('kills',R.kills);
  if(B.over==='lose'){await sleep(600);return endRun(false);}
  R.fights++;const sc=fightScrip(R,B.kind,R.row);const heal=Math.min(R.max-R.hp,6+(has(R,'hat')?6:0));R.hp+=heal;R.earned+=sc;KATel.coins(sc,0);
  const start=R.scrip;R.scrip+=sc;
  const al=B.foes.map(f=>foeCenter(f.uid));const n=Math.min(14,Math.ceil(sc/3));
  al.forEach((c,k)=>flyCoins(c.x,c.y,Math.ceil(n/al.length),$('bScrip'),i=>{renderScrip(Math.min(R.scrip,scripShown+Math.ceil(sc/n)));}));
  setTimeout(()=>renderScrip(R.scrip),FAST?0:1400);
  SFX.win();
  if(B.kind==='boss'){await sleep(1300);return endRun(true);}
  save();await sleep(900);
  rewardSheet(B.kind==='elite',sc,heal);
}

const WIN_LINES=['The Dry Mile goes quiet.','Nobody\'s getting back up. Probably.','That\'ll learn \'em.','The buzzards are already circling.','Your hands finally stop shaking.'];
function priceHtml(o){if(o.price==null)return '';if(o.sold)return `<div class="need" style="color:var(--dim)">Sold</div>`;if(o.price>R.scrip)return `<div class="need">${svg('lock')}<span>Need $${o.price-R.scrip}</span></div>`;return `<div class="pr">$${o.price}</div>`;}
function optHtml(o,i,act,extra){
  if(o.k==='perk'){const P=PERKS[o.id];return `<button class="opt" data-a="${act}" data-i="${i}" ${extra||''}><div class="ic" style="color:${RCOL[o.r]}">${svg('star')}</div><div class="tx"><span class="rt r${o.r}">${RAR[o.r].n} perk${pk(R,o.id)?' · have '+pk(R,o.id):''}</span><b>${P.n}</b><small>${P.d}</small></div>${priceHtml(o)}</button>`;}
  const D=ROUNDS[o.id];return `<button class="opt" data-a="${act}" data-i="${i}" ${extra||''}><div class="ic">${`<div class="ch" style="position:static;margin:0;width:46px;height:46px">${roundChip({id:o.id})}</div>`}</div><div class="tx"><span class="rt r${o.r}">${RAR[o.r].n} round</span><b>${D.n}</b><small>${roundDesc(R,{id:o.id})}</small></div>${priceHtml(o)}</button>`;
}
function rewardSheet(elite,sc,heal){
  const opts=rewardOpts(R,elite);
  openSheet(`<div class="sh-k">${elite?'Bounty collected':'Ambush survived'} · +${sc} scrip${heal?` · +${heal} HP`:''}</div><div class="sh-t">${pick(WIN_LINES)}</div>
    <p class="sh-p">Take one. New rounds go straight into your cylinder.</p>
    <div class="opts">${opts.map((o,i)=>optHtml(o,i,'rew')).join('')}</div>
    <div class="sh-btns"><button class="btn sec" data-a="rewSkip">Pass · +8 scrip</button></div>`);
  sheetActs.rew=b=>{const o=opts[+b.dataset.i];SFX.pick();b.classList.add('picked');
    if(o.k==='perk'){applyPerk(R,o.id);KATel.pick('perk',o.id,{rarity:RAR[o.r].id});tel();showIsland(PERKS[o.id].n,RCOL[o.r]);closeSheet().then(finishNode);}
    else{chamberSheet('load',o.id,()=>{KATel.pick('round',o.id,{rarity:RAR[o.r].id});tel();finishNode();},()=>rewardSheet2());}
  };
  const rewardSheet2=()=>{ // re-open the same choices if they back out of loading
    swapSheet(sheet.innerHTML.replace('<div class="grab"></div>',''));};
  sheetActs.rewSkip=()=>{R.scrip+=8;R.earned+=8;KATel.coins(8,0);renderScrip(R.scrip);bump($('bScrip'));closeSheet().then(finishNode);};
}
function chamberSheet(mode,id,done,back){
  let sel=-1;
  const draw=()=>{
    const n=R.cyl.length,rad=88;
    const chs=R.cyl.map((rd,i)=>{const a=(i*360/n-90)*Math.PI/180;const dis=mode==='hone'&&rd.up;return `<div class="ch${sel===i?' sel':''}" data-a="chpick" data-i="${i}" style="left:${125+Math.cos(a)*rad}px;top:${125+Math.sin(a)*rad}px;${dis?'opacity:.35':''}">${roundChip(sel===i&&mode==='load'?{id}:rd)}</div>`;}).join('');
    const cur=sel>=0?R.cyl[sel]:null;
    let info;
    if(mode==='load')info=cur?`Swap <b>${ROUNDS[cur.id].n}${cur.up?'+':''}</b> for <b style="color:${ROUNDS[id].col}">${ROUNDS[id].n}</b>.`:'Tap a chamber to load it.';
    else info=cur?`<b>${ROUNDS[cur.id].n}</b> becomes <b style="color:var(--sun2)">${ROUNDS[cur.id].n}+</b>: ${roundDesc(R,{id:cur.id,up:1})}`:'Tap a round to hone it 50% stronger.';
    return `<div class="sh-k">${mode==='load'?'New round':'Campfire'}</div><div class="sh-t">${mode==='load'?`Load the ${ROUNDS[id].n} round`:'Hone a round'}</div>
      ${mode==='load'?`<p class="sh-p">${roundDesc(R,{id})}</p>`:''}
      <div class="bigcyl"><div id="cylFrame" style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#5a4a4e,#2a1f26 70%)"></div>${chs}</div>
      <p class="sh-p" id="chInfo">${info}</p>
      <div class="sh-btns"><button class="btn pri" data-a="chOk" ${sel<0?'disabled':''}>${mode==='load'?'Load it':'Hone it'}</button><button class="btn sec" data-a="chBack">${back?'Back':'Keep my cylinder'}</button></div>`;};
  swapSheet(draw());
  sheetActs.chpick=b=>{const i=+b.dataset.i;if(mode==='hone'&&R.cyl[i].up)return;sel=i;SFX.spin();sheet.innerHTML='<div class="grab"></div>'+draw();};
  sheetActs.chOk=()=>{if(sel<0)return;SFX.pick();
    if(mode==='load'){R.cyl[sel]={id};R.ups++;}else{R.cyl[sel].up=1;R.ups++;}
    save();closeSheet().then(done);};
  sheetActs.chBack=()=>{if(back)back();else closeSheet().then(done);};
}

function postSheet(stock,stitched){
  stock=stock||postStock(R);
  const html=`<div class="sh-k">Trading post · $${R.scrip}</div><div class="sh-t">Ma Ledger's</div>
    <p class="sh-p q">"Silver's dear, hellfire's dearer, and I don't take credit from dead men. Which you are, near as I can tell."</p>
    <div class="opts">${stock.map((o,i)=>optHtml(o,i,'buy','').replace('class="opt"',(o.sold||o.price>R.scrip)?'class="opt cant"':'class="opt"')).join('')}
      <button class="opt${stitched||R.hp>=R.max?' na':R.scrip<STITCH.price?' cant':''}" data-a="stitch"><div class="ic" style="color:#ff8a8a">${svg('heart')}</div><div class="tx"><b>Doc Hollis stitches you up</b><small>Heal ${STITCH.heal} HP. He's drunk, but he's quick.</small></div>${stitched?'<div class="need" style="color:var(--dim)">Done</div>':R.hp>=R.max?'<div class="need" style="color:var(--dim)">Full HP</div>':R.scrip<STITCH.price?`<div class="need">${svg('lock')}<span>Need $${STITCH.price-R.scrip}</span></div>`:`<div class="pr">$${STITCH.price}</div>`}</button>
    </div>
    <div class="sh-btns"><button class="btn sec" data-a="leave">Ride on</button></div>`;
  swapSheet(html);
  const spend=v=>{R.scrip-=v;R.spent+=v;KATel.coins(0,v);renderScrip(R.scrip);bump($('mScrip'));SFX.coin();};
  sheetActs.buy=b=>{const o=stock[+b.dataset.i];if(o.sold||o.price>R.scrip)return;
    if(o.k==='perk'){spend(o.price);o.sold=1;applyPerk(R,o.id);KATel.pick('buy',o.id,{rarity:RAR[o.r].id});tel();save();showIsland(PERKS[o.id].n,RCOL[o.r]);postSheet(stock,stitched);}
    else chamberSheet('load',o.id,()=>{spend(o.price);o.sold=1;KATel.pick('buy',o.id,{rarity:RAR[o.r].id});tel();save();postSheet(stock,stitched);},()=>postSheet(stock,stitched));};
  sheetActs.stitch=()=>{if(stitched||R.scrip<STITCH.price)return;spend(STITCH.price);const h=Math.min(STITCH.heal,R.max-R.hp);R.hp+=h;renderHpChip();showIsland(`+${h} HP`,'#a8ffbf');save();postSheet(stock,true);};
  sheetActs.leave=()=>closeSheet().then(finishNode);
}
function oddSheet(){
  const e=pick(ODD);
  openSheet(`<div class="sh-k">Strange</div><div class="sh-t">${e.t}</div><p class="sh-p q">${e.p}</p>
    <div class="opts">${e.o.map((o,i)=>`<button class="opt${o.need&&!o.need(R)?' na':''}" data-a="odd" data-i="${i}"><div class="tx"><b>${o.l}</b><small>${o.s}</small></div>${o.need&&!o.need(R)?`<div class="need">${svg('lock')}<span>Can't pay</span></div>`:''}</button>`).join('')}</div>`);
  sheetActs.odd=b=>{const o=e.o[+b.dataset.i];const res=o.f(R)||{};KATel.pick('event',e.id+':'+b.dataset.i);renderScrip(R.scrip);renderHpChip();

    swapSheet(`<div class="sh-k">Strange</div><div class="sh-t">${e.t}</div><p class="sh-p q">${o.out}</p>${chips.length?`<div class="chips">${chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>`:''}

}

    <div class="sh-btns"><button class="btn pri" data-a="claim" ${sel<0?'disabled':''}>${sel<0?'Pick one':'Claim it'}</button></div>`
    :`<p class="sh-p">You've found every heirloom on the Dry Mile.</p><div class="sh-btns"><div class="row"><button class="btn sec" data-a="toArm">Armory</button><button class="btn pri" data-a="again">Ride again</button></div><button class="btn sec" data-a="toTitle">Title</button></div>`}`;

  sheetActs.claim=()=>{if(sel<0)return;const h=offers[sel];S.own.push(h);if(S.eq.length<3)S.eq.push(h);save();KATel.pick('heir',h,{rarity:RAR[HEIR[h].r].id});
    showIsland(`${HEIR[h].n} claimed`,RCOL[HEIR[h].r]);
    swapSheet(`<div class="sh-k">Heirloom claimed</div><div class="sh-t">${HEIR[h].n}</div><p class="sh-p">${HEIR[h].d}</p>
      <p class="sh-p">${S.eq.includes(h)?'Equipped. It rides with you from now on.':'Your loadout is full. Swap it in at the Armory.'}</p>
      <div class="sh-btns"><button class="btn pri" data-a="again">Ride again</button><div class="row"><button class="btn sec" data-a="toArm">Armory</button><button class="btn sec" data-a="toTitle">Title</button></div></div>`);};
  sheetActs.again=async()=>{await closeSheet();startRun();};
  sheetActs.toArm=()=>armorySheet(async()=>{await closeSheet();show('title');renderTitle();});
  sheetActs.toTitle=async()=>{await closeSheet();show('title');renderTitle();};
  B=null;
}
function armorySheet(onDone){
  const draw=()=>{const all=Object.keys(HEIR).sort((a,b)=>(S.own.includes(b)-S.own.includes(a))||(HEIR[b].r-HEIR[a].r));const n=S.own.length;
    return `<div class="sh-k">Armory · ${n}/${all.length} found</div><div class="sh-t">Heirlooms</div>
    <p class="sh-p">Tap to equip up to 3. They ride with you every run.</p>
    <div class="tray">${[0,1,2].map(i=>{const h=S.eq[i];return `<div class="sl${h?' f':''}" style="${h?'color:'+HEIR[h].col:''}">${h?svg(HGL[h]):''}</div>`;}).join('')}</div>
    <div class="arm" id="armCar">${all.map(h=>{const D=HEIR[h],own=S.own.includes(h),on=S.eq.includes(h);
      return `<button class="acard${own?'':' lock'}${on?' on':''}" data-a="${own?'eq':'noop'}" data-h="${h}"><span class="chk">${svg('check')}</span><div class="ai" style="color:${own?D.col:'var(--mute)'}">${svg(own?HGL[h]:'x')}</div><span class="rt r${D.r}" style="font:800 9px/1 system-ui;letter-spacing:.14em;text-transform:uppercase">${RAR[D.r].n}</span><b>${own?D.n:'Not found yet'}</b><small>${own?D.d:'Finish a run to find heirlooms.'}</small></button>`;}).join('')}</div>
    <div class="sh-btns"><button class="btn pri" data-a="armDone">Done</button></div>`;};
  swapSheet(draw());
  sheetActs.eq=b=>{const h=b.dataset.h;const i=S.eq.indexOf(h);
    if(i>=0)S.eq.splice(i,1);else{if(S.eq.length>=3){showIsland('Unequip one first','#ffcf7a',{key:'full'});return;}S.eq.push(h);}
    save();SFX.pick();const cl=$('armCar').scrollLeft;sheet.innerHTML='<div class="grab"></div>'+draw();$('armCar').scrollLeft=cl;};
  sheetActs.noop=()=>{};
  sheetActs.armDone=()=>onDone();
}

/* ================= BOOT ================= */
renderTitle();
window.__SFS={get S(){return S;},get R(){return R;},get B(){return B;},get busy(){return busy;},get sheetOpen(){return sheetOpen;},get screen(){return screen;},
  get chips(){return chipRects;},act:doAct,aiAct:()=>B&&aiAct(B),simRun,simCampaign,openNodes:()=>R&&openNodes(R),save,ROUNDS,PERKS,HEIR,setRnd:f=>{rnd=f;}};
})();
</script>
